# 发布工作流：在本平台自己编译出 deb / fpk，然后发 GitCode Release
#
# 和 GitHub / CNB / GitLab 是同一个角色 —— 构建方，不是转发方。
# 差别只在环境来源：
#   GitHub  用 ghcr.io/dtapps/golang/fnpack:latest 统一预置镜像（Go/Node/nfpm/fnpack 全烤好）
#   CNB     用 docker.cnb.cool/dtapp/golang/fnpack:latest 统一预置镜像
#   GitLab  用 registry.gitlab.com/dtapps/golang/fnpack:latest 统一预置镜像
#   GitCode 没有「用自己的镜像跑 job」这个能力 → 每次现场装工具链
# 现场安装与打包的逻辑在 scripts/ci/build-linux-packages.sh（Gitee 只搬不建，不走这份脚本）。
#
# 产物（与另外三个平台逐字一致）：
#   bin/fnmusic-sync_amd64.deb  bin/fnmusic-sync_arm64.deb
#   bin/fnmusic-sync-amd64.fpk  bin/fnmusic-sync-arm64.fpk
#
# 前置 secrets：
#   GITCODE_TOKEN  repo 读写。既用于检出私有仓库，也用于建 Release、取上传地址、传文件
#
# 触发：GitCode 页面 → Actions → Release → Run workflow，填 version（必填）。
#       外部也可以用 dispatch 接口拉起：
#       POST /api/v8/repos/:owner/:repo/actions/workflows/release.yml/dispatches
#       {"ref":"main","inputs":{"version":"1.2.3"}}
#       预发布把 version 写成 1.2.3-rc.1 / 1.2.3-nightly.20260101，没有第二个参数。
#
# API 版本：dispatch 走 v8，Release 走 v5。v5 要求 access_token 走 query 串，
# 所以下面只在 cat 响应体时打印状态，不打印完整 URL（URL 里就是令牌）。
#
# 为什么不用 uses: actions/checkout@v4：
# GitCode 的动作市场覆盖范围没法在这里核实，而 git clone 只需要 git 和令牌，
# 是必然可用的最小依赖。代价是多写三行，收益是这层不依赖平台实现。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1 / 1.2.3-nightly.20260101；填 nightly 自动推导当天夜间构建版本；没有后缀就是正式版'
        required: true
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''

# 同一时间只允许一条发布在跑。
# 不能按版本号分组：同一次发布可以被写成 0.1.31 / v0.1.31 两种样子，分组键不同就等于
# 没锁，两条流水线会同时往同一个 tag 传文件、互相覆盖。
# 也不能 cancel-in-progress：这条流水线是「建 Release → 要上传地址 → 逐个 PUT」，
# 砍在中间会留下一个只挂了部分附件的 Release，比排队慢更贵（GitLab 那份设了不可打断，同理）。
concurrency:
  group: release-job
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------
      # 1. 版本号归一化 + 检出代码
      # ---------------------------------------------------------------
      - name: 检出代码
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
          COMMIT_INPUT: ${{ inputs.commit }}
          REPO_PATH: dtapp/fnmusic-sync
        run: |
          set -euo pipefail

          RAW="${VERSION_INPUT:?未传入 version}"
          # 手填的东西会带前后空格（复制粘贴尤其常见）。先削干净，否则 " 0.1.31" 会拼成
          # "v 0.1.31"，下面红在格式校验上，而报错里那个空格肉眼几乎看不见。
          RAW="${RAW#"${RAW%%[![:space:]]*}"}"
          RAW="${RAW%"${RAW##*[![:space:]]}"}"
          # nightly 是「关键词」而不是版本号：要靠「最近正式版 tag」推导成
          # <最近正式版+1 补丁>-nightly.<UTC 日期>，所以它必须在**检出并拉全 tag 之后**
          # 才能算出来（resolve-prerelease.sh 与另外四个平台同一份实现）。
          KEY="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')"
          case "$KEY" in
          nightly | nightly.*) IS_NIGHTLY=true ;;
          *) IS_NIGHTLY=false ;;
          esac

          if [ "$IS_NIGHTLY" = "false" ]; then
            case "$RAW" in v*) TAG="$RAW" ;; *) TAG="v$RAW" ;; esac
            VER="${TAG#v}"

            # 二次校验与 resolve-prerelease.sh 同一条正则。这里必须先判一次：下面要用 TAG 去
            # checkout，而 scripts/ci/resolve-prerelease.sh 在空工作区里还不存在。
            if ! printf '%s' "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
              echo "版本号格式不对：${RAW}（期望 0.1.31 / v0.1.31 / 0.1.32-rc.1 / 0.1.32-nightly.20260101 / nightly）"
              exit 1
            fi
            echo "版本号: ${TAG}"
          else
            echo "版本号关键词: ${RAW}（检出并拉全 tag 后展开成真正的版本号）"
            TAG=""
          fi

          # 检出：runner 已经把仓库挂进来就直接用，否则自己 clone。
          # 需要 git log 生成「更新内容」，所以不能 --depth 1。
          if [ -d .git ] && [ -f go.mod ]; then
            echo "使用 runner 已有工作区"
            git fetch --tags --force origin 2>/dev/null || true
          else
            echo "工作区为空，clone ${REPO_PATH}"
            if [ -n "${GITCODE_TOKEN:-}" ]; then
              URL="https://oauth2:${GITCODE_TOKEN}@gitcode.com/${REPO_PATH}.git"
            else
              URL="https://gitcode.com/${REPO_PATH}.git"
            fi
            if [ -n "$TAG" ]; then
              git clone --branch "$TAG" "$URL" . 2>/dev/null \
                || git clone "$URL" .
            else
              # nightly 关键词：版本号要等检出并拉全 tag 之后才算得出，先按默认分支检出
              git clone "$URL" .
            fi
          fi

          # nightly 关键词（定时任务用）要靠「最近正式版 tag」推导版本号，
          # 两条路径都得把 tag 拉全。
          git fetch --tags --force origin 2>/dev/null || true
          # 还要**完整历史**：release-changelog.sh 的 `git log <上一个 tag>..HEAD` 需要它。
          # 浅克隆（runner 自带工作区通常是 depth=1）会让「更新内容」只剩最新那条提交，
          # 与 GitHub / CNB 侧（完整历史）对不上。
          git fetch --unshallow --quiet 2>/dev/null \
            || git fetch --depth 1000 --quiet 2>/dev/null \
            || true

          # 指定构建提交（GitHub 同步过来的 commit）：各平台自己构建，必须是同一个提交，
          # 否则同一个版本号在不同平台是不同内容。留空 = 默认分支最新提交。
          if [ -n "${COMMIT_INPUT:-}" ]; then
            echo "切换到指定提交: ${COMMIT_INPUT}"
            git fetch --depth 1 origin "${COMMIT_INPUT}" 2>/dev/null \
              || git fetch origin "${COMMIT_INPUT}" 2>/dev/null \
              || true
            if ! git checkout --force "${COMMIT_INPUT}" 2>/dev/null; then
              echo "❌ 切换到提交 ${COMMIT_INPUT} 失败（该提交不在本仓库里？）"
              exit 1
            fi
            echo "当前提交: $(git rev-parse --short HEAD)"
          fi

          # 预发布判定与另外四个平台同一份规则（scripts/ci/resolve-prerelease.sh）：只看后缀。
          # source 它而不是自己写一遍 case。必须放在检出之后：工作区为空时上面才刚 clone
          # 出这个文件。算出来的值写进 .ci-release.env，下游「发布」步骤的 release_status
          # 和正文的「是否预发布」都取这一份，不各判一次。
          # 传原始输入 RAW（不是 TAG）：nightly 关键词要在这里才展开成真正的版本号
          export VERSION="$RAW"
          # shellcheck disable=SC1091
          . scripts/ci/resolve-prerelease.sh
          # source 只带进函数，必须显式调用才会算出 PRERELEASE（以及统一后的 TAG）
          resolve_version "$RAW" || exit 1
          VER="${TAG#v}"
          PRE="$PRERELEASE"
          echo "预发布: ${PRE}"

          # 切到目标 tag：tag 不存在时（nightly 每天一个新 tag）先按当前 HEAD 构建，
          # 发布阶段会因为 tag 缺失而失败，这样错误信息落在「发布」而不是「检出」，定位更快
          git checkout --force "$TAG" 2>/dev/null || echo "警告：本地没有 tag ${TAG}，按当前 HEAD 构建"

          # 后续步骤共用的变量写进文件，不依赖平台的跨 step 变量机制
          # 标题统一带项目名前缀（与另外四个平台的 release.yml 同口径，改名字要一起改）。
          # 用驼峰产品名而不是仓库 slug，更容易被用户认成产品名。
          if [ "$PRE" = "true" ]; then
            TITLE="FnMusicSync ${TAG} (预发布)"
          else
            TITLE="FnMusicSync ${TAG}"
          fi
          {
            echo "TAG=${TAG}"
            echo "VER=${VER}"
            echo "PRE=${PRE}"
            echo "REPO_PATH=${REPO_PATH}"
            echo "TITLE=\"${TITLE}\""
            # 实际被构建的那个提交：指定 commit 构建时它不是 main 的最新提交，
            # Release 的 tag 必须落在它上面（否则「包是 A、tag 指向 B」）。
            echo "BUILD_SHA=$(git rev-parse HEAD)"
          } > .ci-release.env

          git log --oneline -3 || true

      # ---------------------------------------------------------------
      # 2. 现场装工具链并打包
      # ---------------------------------------------------------------
      - name: 构建安装包（deb + fpk，两架构）
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./.ci-release.env

          export VERSION="$TAG"
          export PRERELEASE="$PRE"
          export REPO_SOURCE=gitcode
          export DL_BASE="https://gitcode.com/${REPO_PATH}/releases/download/${TAG}"
          # 正文里「提交」那一行与预发布时的「最新正式版」链接：平台路径由调用方传，
          # scripts/ci/render-release-body.sh 不猜（GitHub 是 /commit，CNB 是 /-/commit）
          export REPO_URL="https://gitcode.com/${REPO_PATH}"
          export COMMIT_URL="${REPO_URL}/commit"
          export COMMIT_SHA="$(git rev-parse HEAD)"
          export STABLE_URL="${REPO_URL}/releases"

          bash scripts/ci/build-linux-packages.sh

      # ---------------------------------------------------------------
      # 3. 发布：建 Release + 逐个上传
      # ---------------------------------------------------------------
      - name: 发布到 GitCode Release
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./.ci-release.env

          : "${GITCODE_TOKEN:?未配置 secret GITCODE_TOKEN}"
          command -v jq >/dev/null 2>&1 || { echo "环境缺少 jq"; exit 1; }

          API="https://api.gitcode.com/api/v5"
          BODY_FILE="release_body.md"
          [ -f "$BODY_FILE" ] || { echo "缺少正文文件 $BODY_FILE"; exit 1; }

          # 幂等：先删同 tag 的旧 release（该端点官方文档未明示，失败只警告不阻断）
          DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "${API}/repos/${REPO_PATH}/releases/${TAG}?access_token=${GITCODE_TOKEN}")
          case "$DEL" in
            200|204) echo "已删除已存在的 release ${TAG}" ;;
            404) echo "无旧 release，直接新建" ;;
            *) echo "⚠ 删除旧 release 返回 HTTP=${DEL}（继续，若创建 409 需手动清理）" ;;
          esac

          # 预发布在这里落地：pre → release_status=pre，latest → release_status=latest
          if [ "$PRE" = "true" ]; then STATUS="pre"; else STATUS="latest"; fi

          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TITLE" \
            --rawfile body "$BODY_FILE" \
            --arg tc "$BUILD_SHA" \
            --arg st "$STATUS" \
            '{tag_name: $tag, name: $name, body: $body, target_commitish: $tc, release_status: $st}')

          echo "创建 GitCode Release: ${TAG}（release_status=${STATUS}）"
          CREATE=$(curl -s -o create.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${API}/repos/${REPO_PATH}/releases?access_token=${GITCODE_TOKEN}")
          if [ "$CREATE" != "200" ] && [ "$CREATE" != "201" ]; then
            echo "创建 release 失败 HTTP=${CREATE}"
            cat create.json 2>/dev/null || true
            exit 1
          fi
          echo "✓ release 已创建"

          # 逐个文件：先要预签名上传地址，再 PUT 文件本体
          for f in bin/*.deb bin/*.fpk bin/SHA256SUMS; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            ENC=$(printf '%s' "$NAME" | jq -sRr @uri)

            UP=$(curl -s -o up.json -w "%{http_code}" \
              "${API}/repos/${REPO_PATH}/releases/${TAG}/upload_url?access_token=${GITCODE_TOKEN}&file_name=${ENC}")
            if [ "$UP" != "200" ]; then
              echo "获取 ${NAME} 上传地址失败 HTTP=${UP}"
              cat up.json 2>/dev/null || true
              exit 1
            fi

            PUT_URL=$(jq -r '.url' up.json)
            # 预签名 URL 要求原样带回 headers（含 Content-Type / x-obs-*），漏一个都会失败
            HDRS=()
            while IFS= read -r h; do HDRS+=(-H "$h"); done \
              < <(jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"' up.json)

            PUT_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "${HDRS[@]}" --upload-file "$f" "$PUT_URL")
            case "$PUT_CODE" in
              200|201|204) echo "  ✓ 已上传 ${NAME}（$(ls -lh "$f" | awk '{print $5}')）" ;;
              *) echo "  ✗ 上传 ${NAME} 失败 HTTP=${PUT_CODE}"; exit 1 ;;
            esac
          done

          # 正文里的下载链接是按 /releases/download/<tag>/<file> 拼的，反查一遍确认能直连。
          # 不通不失败：Release 与附件本身已经传成功，死的只是正文表格里的链接。
          echo ""
          echo "校验正文里的下载链接："
          BAD=0
          for f in bin/*.deb bin/*.fpk bin/SHA256SUMS; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            ENC=$(printf '%s' "$NAME" | jq -sRr @uri)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 \
              "https://gitcode.com/${REPO_PATH}/releases/download/${TAG}/${ENC}" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "  ✓ ${NAME}"
            else
              echo "  ⚠ ${NAME} 返回 HTTP=${CODE}"
              BAD=$((BAD + 1))
            fi
          done
          if [ "$BAD" -gt 0 ]; then
            echo "提示：${BAD} 个文件反查没到 200，若本平台不是 /releases/download/<tag>/<file>"
            echo "      结构，改 scripts/ci/build-linux-packages.sh 的 DL_BASE 与这里的拼法。"
          fi

          echo ""
          echo "完成：https://gitcode.com/${REPO_PATH}/releases/tag/${TAG}"

      # ---------------------------------------------------------------
      # 4. 清理旧 nightly（与 GitHub / CNB / GitLab 的「只保留最近 3 个」同口径）
      # ---------------------------------------------------------------
      - name: 清理旧 nightly Release
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./.ci-release.env

          # 只处理日期 nightly（tag 以 -nightly.YYYYMMDD 结尾），rc / beta / alpha 与正式版不动
          case "${PRE}:${TAG}" in
          true:*-nightly.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
          *) echo "非日期 nightly 发布（${TAG}），跳过清理"; exit 0 ;;
          esac

          API="https://api.gitcode.com/api/v5"
          # 清理是「尽力而为」：任何一步失败只打印，不让 job 变红
          # （Release 已经发布成功了，清理失败只是多留几个包）。
          LIST=$(curl -s "${API}/repos/${REPO_PATH}/releases?per_page=100&access_token=${GITCODE_TOKEN}" || true)
          OLD_TAGS=$(printf '%s' "${LIST}" | jq -r '
            [ .[]
              | select((.prerelease // false) == true)
              | select(.tag_name | test("-nightly\\.[0-9]{8}$")) ]
            | sort_by(.created_at) | reverse | .[].tag_name
          ' 2>/dev/null || true)
          if [ -z "${OLD_TAGS}" ]; then
            echo "没有需要清理的旧 nightly Release"
            exit 0
          fi
          TOTAL=$(printf '%s\n' "${OLD_TAGS}" | grep -c . || true)
          if [ "${TOTAL:-0}" -le 3 ]; then
            echo "nightly Release 共 ${TOTAL:-0} 个，无需清理"
            exit 0
          fi
          # 前 3 个是保留项，其余逐个删
          printf '%s\n' "${OLD_TAGS}" | tail -n +4 | while IFS= read -r OLD; do
            [ -n "${OLD}" ] || continue
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "${API}/repos/${REPO_PATH}/releases/${OLD}?access_token=${GITCODE_TOKEN}" || echo "000")
            case "${CODE}" in
            200|204) echo "已删除旧 nightly Release ${OLD}" ;;
            *) echo "⚠ 删除 Release ${OLD} 失败 HTTP=${CODE}" ;;
            esac
          done
