# 发布工作流
# 手动触发，输入版本号后自动构建 Linux 安装包并发布 GitHub Release
# 
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/dtapps/golang
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1 / 1.2.3-nightly.20260101；没有后缀就是正式版'
        required: true
        type: string

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-26.04
    # 直接使用统一共享的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 由 dtapps 统一维护并推送到 GHCR，无需本仓库自行构建（原 ci-image.yml 已删除）。
    container:
      image: ghcr.io/dtapps/golang/fnpack:latest
    outputs:
      interior_version: ${{ steps.gen.outputs.interior_version }}
      interior_release_title: ${{ steps.gen.outputs.interior_release_title }}
      pre_release: ${{ steps.gen.outputs.pre_release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 解析版本号（预发布看后缀）
        id: gen
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "原始 version: [${VERSION}]"

          # 归一化 / 格式校验 / 预发布判定只有一份实现，在 scripts/ci/resolve-prerelease.sh，
          # 五个平台（CNB / GitHub / GitLab / Gitee / GitCode）都 source 它。
          # 只传版本号：预发布由 `-rc.1` / `-beta.1` / `-alpha.1` /
          # `-nightly.20260101` 这类后缀决定。
          # 以前那个 prerelease 布尔输入已经删掉 —— 它会跟版本号打架，而且打得毫无必要。
          # shellcheck disable=SC1091
          . scripts/ci/resolve-prerelease.sh
          # source 只带进函数，必须显式调用才会算出 TAG / PKG_VERSION / PRERELEASE
          resolve_version "${VERSION}"

          echo "${PRE_NOTE}"

          # 标题统一带项目名前缀（与另外四个平台的 release.yml 同口径，改名字要一起改）。
          # 用驼峰产品名而不是仓库 slug：Release 列表里「FnMusicSync v0.1.32」比
          # 「fnmusic-sync v0.1.32」更像一次发布，也更容易被用户认成产品名。
          PROJECT_NAME="FnMusicSync"

          # 预发布版本在标题上带个后缀，便于在 Release 列表里一眼区分
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="${PROJECT_NAME} ${TAG} (预发布)"
          else
            RELEASE_TITLE="${PROJECT_NAME} ${TAG}"
          fi

          {
            echo "interior_version=${TAG}"
            echo "interior_release_title=${RELEASE_TITLE}"
            # 只在本 job 之间传，不再来自用户输入
            echo "pre_release=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

  # 构建 + 打包 Linux 安装包（deb/fpk）
  build:
    needs: prepare
    runs-on: ubuntu-26.04
    # 直接使用统一共享的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 由 dtapps 统一维护并推送到 GHCR，无需本仓库自行构建（原 ci-image.yml 已删除）。
    container:
      image: ghcr.io/dtapps/golang/fnpack:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      # 无需再 apt 装 GTK/WebKit、setup-go/node、make tool-deps——镜像里都已就绪。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        shell: bash
        run: make deps

      - name: 打包 Linux 安装包（deb/fpk）
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${VERSION} REPO_SOURCE=github GITHUB_TOKEN="${GITHUB_TOKEN}" make package-linux-all

      - name: 清理二进制文件 + .tar.gz 压缩包
        shell: bash
        run: make clean-archives

      # 附件校验文件：用户下载后总要能核对一遍包没被篡改/没下坏。
      # 正文的「校验」一节只在 bin/SHA256SUMS 存在时才写，所以这一步不能省。
      - name: 生成校验文件
        shell: bash
        run: |
          set -eu
          cd bin
          : > SHA256SUMS
          for f in *.deb *.fpk; do
            [ -e "${f}" ] || continue
            sha256sum "${f}" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: fnmusic-sync-release
          path: bin/*
          if-no-files-found: error
          retention-days: 1

  # 构建完成后，发布 GitHub Release
  release:
    needs: [build, prepare]
    runs-on: ubuntu-26.04

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          name: fnmusic-sync-release
          path: release

      # 发版前先把版本号这件事验干净。这几件事出错都不会让构建失败，
      # 但会发出一个「看起来成功、内容是错的」Release。
      - name: 校验版本号与 tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
        run: |
          set -eu
          echo "版本号: ${VERSION}"

          # checkout 已带 fetch-depth: 0，这里再补一次兜底
          git fetch --tags --quiet --force || true
          count=$(git tag -l 'v*' | wc -l | tr -d ' ')
          echo "本地版本 tag: ${count} 个"
          if [ "$count" -eq 0 ]; then
            echo "❌ 一个版本 tag 都没有，changelog 会退化成「首次发布」"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "❌ tag ${VERSION} 已存在，不能重复发布"
            exit 1
          fi
          echo "✅ tag ${VERSION} 不存在，可以发布"

          if [ "${PRERELEASE}" = "false" ]; then
            # nightly 必须排除：sort -V 会把 v1.2.3-nightly.20260101 排在 v1.2.3 之后，
            # 留着它会让随后发的正式版被误判成「比已有正式版旧」，直接挡住发布。
            latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
              echo "❌ 版本号 ${VERSION} 比已有的正式版 ${latest} 旧"
              exit 1
            fi
            echo "✅ 比上一个正式版 ${latest:-（无）} 新"
          fi

      # 正文只有一份实现（scripts/ci/render-release-body.sh），另外四个平台也调用它，
      # 避免各写一遍表格/标题/下载链接，改一处忘一处。
      - name: 生成 Release 正文
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
          REPO_URL: https://github.com/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_DIR: release
          OUT_FILE: release_body.md
        run: |
          set -eu

          # 下载基址在脚本里拼，不写进 env：整条 URL 太长，yamlfmt 会把表达式折行
          DL_BASE="${REPO_URL}/releases/download/${VERSION}"
          STABLE_URL="${REPO_URL}/releases/latest"
          export DL_BASE STABLE_URL

          # 更新内容：按渠道选对比基准（rc 对 rc、beta 对 beta、alpha 对 alpha、
          # nightly 对 nightly、正式版对正式版；
          # 首次发某渠道则回退到上一个正式版）。实现见 scripts/ci/release-changelog.sh，
          # 五个平台共用一份，避免判定口径跑偏。
          # GitHub 的提交路径是 /commit/<sha>，和 CNB 的 /-/commit 不同，前缀显式传
          CHANGELOG=$(COMMIT_URL="${REPO_URL}/commit" sh scripts/ci/release-changelog.sh "${VERSION}")
          # 直接 export 给同一步的脚本：写 $GITHUB_ENV 只对**后续** step 生效，
          # 本 step 里读不到，之前那样写 CHANGELOG 会是空的。
          export CHANGELOG

          sh scripts/ci/render-release-body.sh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.interior_version }}
          name: ${{ needs.prepare.outputs.interior_release_title }}
          draft: false
          # 必须是**小写**的 true / false —— 别改成表达式或把输入直接透传过来。
          # softprops/action-gh-release@v3 内部是
          #   input_prerelease: env.INPUT_PRERELEASE ? env.INPUT_PRERELEASE == 'true' : undefined
          # （src/util.ts，已对照 v3 源码与构建产物确认）：它按字面量 'true' 精确比较，
          # 没有 trim、没有 toLowerCase。所以 "TRUE" / "True" / " true" 都会**静默变成 false**，
          # 方向正好是危险的那一边：rc 会被当成正式版发布出去，稳定用户直接被推到预发布上。
          # 现在能保证小写，只因为 resolve-prerelease.sh 的 case 里写死的就是这两个值；
          # 任何人把它「简化」成从表单/开关透传，这条约定当场就破。
          prerelease: ${{ needs.prepare.outputs.pre_release }}
          body_path: release_body.md
          files: release/*
