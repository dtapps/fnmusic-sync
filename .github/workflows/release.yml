# 发布工作流
# 两种触发：手动填版本号；每天 UTC 00:00 定时构建 nightly 预发布。
# 均自动构建 Linux 产物（tar.gz/deb/fpk）并发布 GitHub Release，最后推送通知。
#
# GitHub 侧版本号由 dtapps/release-version-action 解析与校验，规则如下：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#
# 「是不是预发布」不接受人工勾选，只看版本号后缀：布尔输入会和版本号打架。
#
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/dtapps/golang
name: Release

on:
  # 每天 UTC 00:00（北京时间 08:00）。
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1 / 1.2.3-nightly.20260101；填 nightly 自动生成带日期的 nightly
          版本；无后缀即正式版'
        required: true
        type: string
        default: 'nightly'

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # 独立版本门禁：Docker Action 放在宿主机 job，解析与 Tag 校验全部通过后才放行其他 job。
  version-gate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: 解析版本号
        id: version
        uses: dtapps/release-version-action@main
        env:
          TZ: UTC
        with:
          mode: parse
          version: ${{ inputs.version || 'nightly' }}
          fetch_tags: false
          nightly_fallback: error

      - name: 校验版本号与 tag
        uses: dtapps/release-version-action@main
        with:
          mode: validate
          version: ${{ steps.version.outputs.tag }}
          fetch_tags: true
          allow_existing_nightly: true

  prepare:
    needs: version-gate
    runs-on: ubuntu-26.04
    # 直接使用统一共享的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 由 dtapps 统一维护并推送到 GHCR，无需本仓库自行构建（原 ci-image.yml 已删除）。
    container:
      image: ghcr.io/dtapps/golang/fnpack:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
    outputs:
      interior_version: ${{ steps.gen.outputs.interior_version }}
      interior_release_title: ${{ steps.gen.outputs.interior_release_title }}
      pre_release: ${{ steps.gen.outputs.pre_release }}
      build_time: ${{ steps.gen.outputs.build_time }}
      git_commit: ${{ steps.gen.outputs.git_commit }}
      git_commit_full: ${{ steps.gen.outputs.git_commit_full }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # nightly 推导要读「最近正式版」的 tag，必须把 tag 全拉下来：
          # 默认 shallow clone 只有当前分支的 1 个 commit，tag 一个都取不到。
          fetch-depth: 0
          # 构建触发时的提交：定时任务即默认分支当时的 HEAD。
          ref: ${{ github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 生成构建与发布参数
        id: gen
        shell: bash
        env:
          TAG: ${{ needs['version-gate'].outputs.tag }}
          PRERELEASE: ${{ needs['version-gate'].outputs.prerelease }}
        run: |
          set -eu

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$(pwd)"

          PROJECT_NAME="FnMusicSync"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="${PROJECT_NAME} ${TAG} (预发布)"
          else
            RELEASE_TITLE="${PROJECT_NAME} ${TAG}"
          fi

          BUILD_TIME="$(bash scripts/get-build-time.sh 2>/dev/null || true)"
          if [ -z "${BUILD_TIME}" ]; then
            BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          fi

          {
            echo "interior_version=${TAG}"
            echo "interior_release_title=${RELEASE_TITLE}"
            echo "pre_release=${PRERELEASE}"
            echo "build_time=${BUILD_TIME}"
            echo "git_commit=$(git rev-parse --short HEAD)"
            echo "git_commit_full=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # 构建 + 打包 Linux 产物（tar.gz/deb/fpk）
  build:
    needs: [version-gate, prepare]
    runs-on: ubuntu-26.04
    # 直接使用统一共享的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 由 dtapps 统一维护并推送到 GHCR，无需本仓库自行构建（原 ci-image.yml 已删除）。
    container:
      image: ghcr.io/dtapps/golang/fnpack:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 与 prepare 同一个提交，确保版本号推导与实际打包使用同一份源码。
          ref: ${{ github.sha }}
          # 需要上一个 tag 算 fpk 的更新内容，shallow clone 只有 1 个 commit，
          # git describe / git log 都会退化。
          fetch-depth: 0

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      # 无需再 apt 装 GTK/WebKit、setup-go/node、make tool-deps——镜像里都已就绪。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装全部 Go 依赖
        run: make deps-go

      - name: 安装全部前端依赖
        run: make deps-node

      - name: 打包 Linux 产物（tar.gz/deb/fpk）
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${VERSION} GORELEASER_CURRENT_TAG=${VERSION} REPO_SOURCE=github GITHUB_TOKEN="${GITHUB_TOKEN}" make goreleaser-release

      # 校验文件由 GoReleaser 生成 tar.gz/deb 部分，package-fpk.sh 在打完 fpk 后追加。
      # 正文的「校验」一节只在 dist/SHA256SUMS 存在时才写，这里再兜底确认各类包都在。
      - name: 校验校验文件
        shell: bash
        run: |
          set -eu
          test -s dist/SHA256SUMS
          for f in dist/*.deb dist/*.fpk dist/fnmusic-sync-linux-*.tar.gz; do
            grep -qF "  ${f##*/}" dist/SHA256SUMS || {
              echo "❌ SHA256SUMS 缺少 ${f##*/}"
              exit 1
            }
          done
          cat dist/SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: fnmusic-sync-release
          path: |
            dist/*.deb
            dist/*.fpk
            dist/fnmusic-sync-linux-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # 构建完成后，发布 GitHub Release
  release:
    needs: [version-gate, build, prepare]
    runs-on: ubuntu-26.04

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 与 prepare / build 同一个提交，保证 Release 正文和 changelog 对应实际产物。
          ref: ${{ github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          name: fnmusic-sync-release
          path: release

      - name: 生成 Release 正文
        id: changelog
        uses: dtapps/release-changelog-action@main
        with:
          mode: release
          version: ${{ needs.prepare.outputs.interior_version }}
          commit: ${{ needs.prepare.outputs.git_commit_full }}
          build_time: ${{ needs.prepare.outputs.build_time }}
          stable_url: https://github.com/${{ github.repository }}/releases/latest
          artifact_dir: release
          fetch_tags: false
          fetch_history: false

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.interior_version }}
          name: ${{ needs.prepare.outputs.interior_release_title }}
          draft: false
          # 必须是**小写**的 true / false —— 别改成表达式或把输入直接透传过来。
          # softprops/action-gh-release@v3 内部是
          #   input_prerelease: env.INPUT_PRERELEASE ? env.INPUT_PRERELEASE == 'true' : undefined
          # （src/util.ts，已对照 v3 源码与构建产物确认）：它按字面量 'true' 精确比较，
          # 没有 trim、没有 toLowerCase。所以 "TRUE" / "True" / " true" 都会**静默变成 false**，
          # 方向正好是危险的那一边：rc 会被当成正式版发布出去，稳定用户直接被推到预发布上。
          # 现在能保证小写，只因为 resolve-prerelease.sh 的 case 里写死的就是这两个值；
          # 任何人把它「简化」成从表单/开关透传，这条约定当场就破。
          prerelease: ${{ needs.prepare.outputs.pre_release }}
          # 固定 tag 指向实际构建的提交，而不是发布 job 运行时可能已经前进的分支头。
          target_commitish: ${{ needs.prepare.outputs.git_commit_full }}
          body_path: ${{ steps.changelog.outputs.body_file }}
          files: release/*

      # protect 保住正式版、latest/stable 与 rc/beta/alpha，避免 by_count 误删非 nightly 版本；
      # dry_run 必须显式为 false，否则插件默认只列出待删除版本。
      - name: 清理旧 nightly（只保留最近 3 个）
        uses: dtapps/release-cleaner-action@main
        continue-on-error: true
        with:
          mode: by_count
          keep: 3
          protect: '^(v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[.-]?[0-9A-Za-z.-]*)?|latest|stable)$'
          delete_git_tag: true
          dry_run: false

  # GitHub 侧的发版公告：Release 发布成功后，在仓库 Discussions 里开一条讨论。
  #
  # 正文与 CNB 侧同一份脚本渲染（scripts/ci/render-announcement-body.sh），
  # 只有下载表指向自家平台（GitHub 的下载表来自 GitHub Release 正文，CNB 的是替换过链接的版本）。
  # 用 Discussions 而不是 Issue：公告是对外的版本说明，讨论区更贴切；
  # 也不需要像 CNB 那样再让 NPC 追加一条评论。
  #
  # 令牌：GITHUB_TOKEN 需要 discussions: write（下面 permissions 显式声明）。
  # 仓库还要在 Settings → General 里打开 Discussions，否则接口 404 —— 只告警跳过，不影响发布。
  announce:
    needs: [version-gate, release, prepare]
    runs-on: ubuntu-26.04
    # nightly 每天一个 tag：每天都开一条讨论会把讨论区刷成日报。
    # 直接在 job 级跳过——job 不跑，两个 step 都不会执行，也就不存在「跳过了一半」的问题。
    if: ${{ !contains(needs.prepare.outputs.interior_version, 'nightly') }}
    permissions:
      contents: read
      discussions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 归一化后的 tag：v1.2.3 / v1.2.3-rc.1 / v1.2.4-nightly.20260101
      VERSION: ${{ needs.prepare.outputs.interior_version }}
      PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
      REPO_URL: https://github.com/${{ github.repository }}
      COMMIT_SHA: ${{ needs.prepare.outputs.git_commit_full }}
      # 是否发公告 + 讨论分类（和 CNB 侧一样放 job 级 env）
      ANNOUNCEMENT_ENABLED: 'true'
      ANNOUNCEMENT_DISCUSSION_CATEGORY: 'General'
      # 分类 id：填了就直接用，跳过「列分类」接口（GITHUB_TOKEN 读不到 Discussions 时用它绕开）
      ANNOUNCEMENT_DISCUSSION_CATEGORY_ID: ''
      # 发公告用的令牌：GITHUB_TOKEN 在部分仓库 / 组织策略下读不到 Discussions（接口 404，
      # 看着像「没开启 Discussions」）。配一个带 repo 权限的 PAT（经典 PAT 勾 repo；
      # fine-grained 勾 Discussions: read & write）覆盖它；没配就退回 GITHUB_TOKEN。
      ANNOUNCEMENT_TOKEN: ${{ secrets.ANNOUNCEMENT_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 生成公告正文
        shell: bash
        run: |
          set -euo pipefail

          # 正文与 Release 正文同源：直接取已发布 Release 的正文，不重新渲染。
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '.body // ""' > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::warning::取不到 Release 正文，跳过发版公告"
            exit 0
          fi

          export VERSION PRERELEASE
          export RELEASE_BODY="release_body.md"
          export OUT_FILE="announcement_body.md"
          export TITLE_FILE="announcement-title.txt"
          export CNB_WEB_BASE="https://cnb.cool/dtapp/fnmusic-sync/-"
          export GITHUB_WEB="${REPO_URL}"
          # 提交链接指向 GitHub 的提交页（CNB 侧不传这个变量，脚本会用 CNB 的地址拼）
          export COMMIT_URL="${REPO_URL}/commit"
          export STABLE_URL="${REPO_URL}/releases/latest"
          export COMMIT_SHA="${COMMIT_SHA}"

          # 渲染失败只告警并结束这一步：这里跑在 Release 发布之后，不该让流水线变红。
          # 下一步读不到标题会自动告警跳过（见 github-script 里的 try/catch）。
          if ! sh scripts/ci/render-announcement-body.sh > /dev/null; then
            echo "::warning::生成公告正文失败，跳过发版公告"
            exit 0
          fi
          echo "公告正文已生成：${OUT_FILE}"

      # 用官方 actions/github-script 调 Discussions API。
      # 为什么不用社区的 create-discussion 之类：那些不是 GitHub 官方维护的（作者/星数都很少），
      # 而 actions/github-script 是 actions 组织下的官方 action（Discussions 走它的 github.request 路由调用）。
      # 官方没有专门「发讨论」的 action，Discussion 的 REST 接口只能这样调。
      # 用官方 actions/github-script 调 Discussions API。
      # 为什么不用社区的 create-discussion 之类：那些不是 GitHub 官方维护的；
      # 官方也没有专门「发讨论」的 action，Discussions 只能这样调。
      #
      # ⚠️ 统一走 github.request 的「路由字符串」写法，不要用 github.rest.discussions.*：
      # github-script v9 打包的 octokit 里 discussions 这组生成方法不存在
      # （实测报 Cannot read properties of undefined (reading 'listCategories')），
      # 而 request 是官方通用的调用出口，不依赖这组生成方法。
      - name: 发布公告到 Discussions
        uses: actions/github-script@v9
        env:
          TITLE_FILE: announcement-title.txt
          BODY_FILE: announcement_body.md
        with:
          github-token: ${{ env.ANNOUNCEMENT_TOKEN }}
          retries: 2
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo

            // 标题与正文都从文件读：脚本注入的坑（把不可信内容拼进 JS）就绕开了。
            // 上一步如果整体跳过（取不到 Release 正文 / 渲染失败）就不会有这两个文件，
            // 读失败只告警并跳过——公告失败不该让发布流水线变红。
            let title
            let body
            try {
              title = fs.readFileSync(process.env.TITLE_FILE, 'utf8').trim()
              body = fs.readFileSync(process.env.BODY_FILE, 'utf8')
            } catch (err) {
              core.warning(`读不到公告标题或正文（${err.message}），跳过发版公告`)
              return 'skipped'
            }

            // 开关：只有 true / 1 / yes / on 才发，其余值跳过。
            const enabled = String(process.env.ANNOUNCEMENT_ENABLED || '').toLowerCase()
            if (!['1', 'true', 'yes', 'on'].includes(enabled)) {
              core.warning(`发版公告已关闭（ANNOUNCEMENT_ENABLED=${process.env.ANNOUNCEMENT_ENABLED}）`)
              return 'skipped'
            }

            const wantCategory = process.env.ANNOUNCEMENT_DISCUSSION_CATEGORY || 'General'
            // 分类 node id（DIC_kwDO... 这种），填了就跳过「查分类」的 GraphQL 查询。
            const wantCategoryId = process.env.ANNOUNCEMENT_DISCUSSION_CATEGORY_ID || ''

            try {
              // GitHub 没有仓库 Discussions 的 REST 端点（REST 里只有 org/team discussions），
              // 所以列分类、查讨论、建讨论、改讨论一律走 GraphQL。
              const repoQuery = `
                query ($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    id
                    discussionCategories(first: 25) { nodes { id name } }
                  }
                }`
              const { repository } = await github.graphql(repoQuery, { owner, repo })
              const repositoryId = repository.id

              let categoryId = wantCategoryId
              if (categoryId) {
                core.info(`使用配置的讨论分类 node id=${categoryId}（跳过分类查询）`)
              } else {
                const categories = repository.discussionCategories.nodes
                const picked = categories.find((c) => c.name === wantCategory) || categories[0]
                if (!picked) {
                  core.warning('没有可用的讨论分类，跳过发版公告')
                  return 'skipped'
                }
                categoryId = picked.id
                core.info(`讨论分类：${picked.name}（${categoryId}）`)
              }

              // Discussion 建出来删不掉，所以先按标题找出**所有**同版本讨论，
              // 每一条都更新成同一份内容（关掉会让读者以为版本被撤了，不关）。
              const listQuery = `
                query ($owner: String!, $repo: String!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    discussions(first: 100, after: $cursor) {
                      nodes { id number title }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }`
              const matches = []
              let cursor = null
              for (;;) {
                const res = await github.graphql(listQuery, { owner, repo, cursor })
                const page = res.repository.discussions
                for (const d of page.nodes) {
                  if (d.title === title) matches.push(d)
                }
                if (!page.pageInfo.hasNextPage) break
                cursor = page.pageInfo.endCursor
              }

              const updateMutation = `
                mutation ($id: ID!, $title: String!, $body: String!) {
                  updateDiscussion(input: { discussionId: $id, title: $title, body: $body }) {
                    discussion { number }
                  }
                }`

              if (matches.length > 0) {
                const [keep, ...others] = matches
                await github.graphql(updateMutation, { id: keep.id, title, body })
                core.info(`已更新发版公告讨论 #${keep.number}`)
                for (const other of others) {
                  await github.graphql(updateMutation, { id: other.id, title, body })
                  core.info(`已同步更新同版本讨论 #${other.number}`)
                }
                return `updated:${keep.number}`
              }

              const createMutation = `
                mutation ($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: { repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body }) {
                    discussion { number url }
                  }
                }`
              const created = await github.graphql(createMutation, { repositoryId, categoryId, title, body })
              core.info(`已创建发版公告讨论 #${created.createDiscussion.discussion.number}`)
              return `created:${created.createDiscussion.discussion.number}`
            } catch (err) {
              // 公告失败不该把发布流水线标红：Release 已经发出去了。
              // 404 / 权限类错误最可能是令牌没给 Discussions 权限（fine-grained: Discussions: Read and write）。
              const hint = /not found|forbidden|permission/i.test(err.message || '')
                ? '（多半是令牌没有 Discussions 权限：fine-grained PAT 需勾 Discussions: Read and write，然后配到 secret ANNOUNCEMENT_TOKEN）'
                : ''
              core.warning(`发版公告失败${hint}，请手工补一条：${err.message}`)
              return 'failed'
            }

  # 构建 / 发布完成后，通过 ServerChan3（方糖）推送 webhook 通知。
  # 需配置 secret SERVERCHAN_SENDKEY（形如 SCTxxxx 或 sctp{uid}t...）；未配置则跳过通知。
  # API 文档：https://doc.sc3.ft07.com/zh/serverchan3/server/api
  # 推送地址：SCT 转发 key → https://sctapi.ftqq.com/<sendkey>.send
  #          带 uid 的 sendkey（sctp 开头）→ https://<uid>.push.ft07.com/send/<sendkey>.send
  notify:
    needs: [version-gate, release, prepare]
    runs-on: ubuntu-26.04
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
      VERSION: ${{ needs.prepare.outputs.interior_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
      GIT_COMMIT: ${{ needs.prepare.outputs.git_commit }}
    steps:
      - name: 发送 ServerChan3 通知
        if: ${{ env.SERVERCHAN_SENDKEY != '' }}
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          set -eu
          # 支持两种 ServerChan3 key：
          #   - 以 sctp 开头（带 uid 的 sendkey）→ https://<uid>.push.ft07.com/send/<key>.send
          #   - 其他（SCT 转发 key）            → https://sctapi.ftqq.com/<key>.send
          SENDKEY_VAL="$SENDKEY"
          if [[ "$SENDKEY_VAL" =~ ^sctp([0-9]+)t ]]; then
            URL="https://${BASH_REMATCH[1]}.push.ft07.com/send/${SENDKEY_VAL}.send"
          else
            URL="https://sctapi.ftqq.com/${SENDKEY_VAL}.send"
          fi
          # 注意：URL 含 sendkey（密钥），禁止整体打印，仅打印域名避免日志泄露密钥
          echo "推送 ServerChan3 通知: ${URL%%/*}"

          TAG="${VERSION}"
          REPO="${{ github.repository }}"

          # GitHub Release 页面地址。
          GH_RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          TITLE="FnMusicSync ${TAG} 构建完成"
          TAGS="FnMusicSync|stable"
          if [ "${PRERELEASE}" = "true" ]; then
            TITLE="FnMusicSync ${TAG} (预发布) 构建完成"
            TAGS="FnMusicSync|prerelease"
          fi
          DESP="**版本**: \`${TAG}\`  "$'\n'
          # 构建时间换算成中国时区（UTC+8）展示：BUILD_TIME 是 UTC ISO8601（...Z），
          # 直接 `date -d "$BT" -u` 只是把同一时刻按 UTC 格式化（显示的还是 UTC），
          # 不能再标成 UTC+8，所以这里用 TZ=Asia/Shanghai 真正换时区。
          BUILD_TIME_CN=$(TZ=Asia/Shanghai date -d "${BUILD_TIME}" +'%Y-%m-%d %H:%M:%S' 2>/dev/null || true)
          if [ -z "${BUILD_TIME_CN}" ]; then
            BUILD_TIME_CN="${BUILD_TIME}"
          else
            BUILD_TIME_CN="${BUILD_TIME_CN} (UTC+8)"
          fi
          DESP="${DESP}**构建时间**: ${BUILD_TIME_CN}  "$'\n'
          DESP="${DESP}**Git 提交**: ${GIT_COMMIT}  "$'\n'
          DESP="${DESP}**GitHub Release**: [${TAG}](${GH_RELEASE_URL})  "$'\n'

          echo "推送 ServerChan3 通知: ${TITLE}"
          HTTP=$(curl -s -o /tmp/sc3.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg desp "$DESP" \
              --arg tags "$TAGS" \
              '{title: $title, desp: $desp, tags: $tags}')" \
            "$URL")

          echo "ServerChan3 响应 HTTP=${HTTP}"
          cat /tmp/sc3.json || true
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ServerChan3 通知发送失败（HTTP=${HTTP}）"
          else
            echo "✓ 已发送 ServerChan3 通知"
          fi
