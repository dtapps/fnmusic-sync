'**':
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_build_go_project:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/ci/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
          - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      imports: https://cnb.cool/dtapp/envs/-/blob/main/update.yml # 导入外部环境变量/配置
      stages:
        - name: 解析版本号（预发布看后缀）
          script: |
            set -eu
            echo "原始 version: [${version:-}]"

            # 归一化 + 格式校验 + 预发布判定只有一份实现，在 scripts/ci/resolve-prerelease.sh，
            # 五个平台（CNB / GitHub / GitLab / Gitee / GitCode）共同 source 它。
            # 这里只传版本号：预发布由 `-rc.1` / `-beta.1` / `-alpha.1` 这类后缀决定，
            # 页面上已经没有开关可以对账了（老的 pre_release 环境变量就算还在也不读）。
            export VERSION="${version:-}"
            # shellcheck disable=SC1091
            . scripts/ci/resolve-prerelease.sh

            echo "${PRE_NOTE}"
            echo "tag: ${TAG}  包版本: ${PKG_VERSION}  预发布: ${PRERELEASE}"

            # 判定完再输出：中途失败时不会留下一半 env 给下游。
            echo "##[set-output interior_version=${TAG}]"
            echo "##[set-output pre_release=${PRERELEASE}]"
          exports:
            interior_version: INTERIOR_VERSION
            pre_release: PRE_RELEASE

        - name: 安装所有依赖
          script: make deps

        - name: 打包 Linux 安装包（deb/fpk）
          script: VERSION=${INTERIOR_VERSION} REPO_SOURCE=cnb CNB_TOKEN="$FNMUSIC_SYNC_TOKEN" make package-linux-all

        - name: 清理二进制文件 + .tar.gz 压缩包
          script: make clean-archives

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/changelog.html
        - name: 生成 Release 日志
          image: cnbcool/changelog
          allowFailure: true # 仓库首个 tag 时 changelog 插件无法生成日志，允许该 job 失败继续发布
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        - name: 生成 Release 正文
          script: |
            # 打包没出产物就别往下走：否则会发出一个零附件的 Release，正文表格是空的，
            # 看起来「成功」，用户点开什么都下不到（GitLab 那份早就有这道闸，这里补上）。
            count=$(find bin -maxdepth 1 -type f \( -name '*.deb' -o -name '*.fpk' \) | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "❌ 打包没有产出任何 deb/fpk，先看 make package-linux-all 的日志"
              exit 1
            fi
            echo "产物 ${count} 个"

            CNB_BASE="${CNB_REPO_URL_HTTPS%/}/-"
            DL_BASE="${CNB_BASE}/releases/download/${INTERIOR_VERSION}"

            if [ "${PRE_RELEASE}" = "true" ]; then
              RELEASE_TYPE="🚧 预发布版本 (Pre-release)"
            else
              RELEASE_TYPE="✅ 正式发布版本 (Stable)"
            fi
            BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            {
              if [ "${PRE_RELEASE}" = "true" ]; then
                echo "## ⚠️ 预发布版本"
                echo ""
                echo "> 这是预发布版本，可能包含未充分测试的功能。"
                echo "> 如需稳定版本，请使用 [正式发布](${CNB_BASE}/releases)。"
                echo ""
              fi

              echo "## 发布信息"
              echo ""
              echo "| 项目 | 内容 |"
              echo "| --- | --- |"
              echo "| 版本号 | ${INTERIOR_VERSION} |"
              echo "| 发布类型 | ${RELEASE_TYPE} |"
              echo "| 是否预发布 | ${PRE_RELEASE} |"
              echo "| 构建时间 | ${BUILD_TIME} |"
              echo ""
              echo "## 下载"
              echo ""
              echo "| 平台 | 架构 | 文件 | 大小 | 说明 |"
              echo "|------|------|------|------|------|"

              for f in bin/*; do
                [ -e "$f" ] || continue
                [ -d "$f" ] && continue
                fname=$(basename "$f")
                [ "$fname" = "SHA256SUMS" ] && continue
                fsize=$(ls -lh "$f" | awk '{print $5}')

                PLAT="Linux"
                ARCH="-"
                DESC="其它"
                case "$fname" in
                  *.deb)
                    ARCH="${fname#fnmusic-sync_}"; ARCH="${ARCH%.deb}"
                    DESC="Debian/Ubuntu 安装包" ;;
                  *.fpk)
                    ARCH="${fname#fnmusic-sync-}"; ARCH="${ARCH%.fpk}"
                    DESC="飞牛 fnOS 应用包" ;;
                esac

                echo "| ${PLAT} | ${ARCH} | [${fname}](${DL_BASE}/${fname}) | ${fsize} | ${DESC} |"
              done

              echo ""
              echo "## 更新内容"
              echo ""
              echo "${LATEST_CHANGE_LOG}"
            } > release_body.md

            cat release_body.md

        # 生成 Release 选项文件（preRelease 按传入值动态设置），供 git:release 的 optionsFrom 引用
        - name: 生成 Release 选项文件
          script: |
            set -eu
            # preRelease 必须是确定的 true/false：空值写进 yml 后 git:release 会当成脏配置，
            # 报错还落在「发布」那一步，跟真正的原因隔了三屏。空就直接死在这一步。
            : "${INTERIOR_VERSION:?INTERIOR_VERSION 为空——第一步没跑成功}"
            : "${PRE_RELEASE:?PRE_RELEASE 为空——第一步没跑成功}"
            cat > release_options.yml << EOF
            tag: ${INTERIOR_VERSION}
            title: "${INTERIOR_VERSION}"
            descriptionFromFile: release_body.md
            preRelease: ${PRE_RELEASE}
            EOF
            cat release_options.yml

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 发布 Release
          type: git:release
          optionsFrom: release_options.yml

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - 'bin/*'
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
