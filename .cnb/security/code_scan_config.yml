# CNB 代码安全扫描配置
# 文档: https://docs.cnb.cool/zh/security/config-file.html

# 秘密扫描（API Key、Token、凭据等）
secrets:
  scan:
    paths:
      - vendor/**          # 跳过 vendor 依赖目录
      - "**/*_test.go"     # 跳过 Go 测试文件
      - "**/testdata/**"   # 跳过 Go 测试数据目录

# 软件成分分析（依赖漏洞扫描）
software-composition-analysis:
  scan:
    paths:
      - vendor/**          # 跳过 vendor 依赖目录
      - "**/*_test.go"     # 跳过 Go 测试文件
      - "**/testdata/**"   # 跳过 Go 测试数据目录
