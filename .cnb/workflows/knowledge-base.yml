# 知识库构建
# https://docs.cnb.cool/zh/ai/knowledge-base.html
# https://docs.cnb.cool/zh/build/internal-steps/knowledge/update.html
'**':
  push:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          allowFailure: true
  tag_push:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          allowFailure: true

$:
  # Issue 创建时
  issue.open:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
  # Issue 关闭时
  issue.close:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
  # Issue 重新打开时
  issue.reopen:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
  # 名称、描述、处理人、标签、优先级变更时
  issue.update:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
  # Issue 评论时
  issue.comment:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
