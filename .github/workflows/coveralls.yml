# 覆盖率上报到 Coveralls（独立工作流）
#
# 为什么独立：
#   - 与 Codecov 解耦：Coveralls 侧故障 / token 失效不会拖垮 Codecov 上传与测试 job；
#   - 凭证隔离：只用内置 GITHUB_TOKEN + COVERALLS_REPO_TOKEN，不扩散到 Codecov 流程；
#   - Codecov 那条（.github/workflows/codecov.yml）已经跑通，不动它。
#
# 参考：
#   https://github.com/coverallsapp/github-action
#
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/coverallsapp/github-action
# https://github.com/dtapps/golang
name: Coveralls

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: coveralls-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  coverage:
    runs-on: ubuntu-26.04
    # 统一使用预构建的 CI 基础镜像（含 Go/Node/pnpm + 全部 Go 工具链）
    container:
      image: ghcr.io/dtapps/golang/fnpack:latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        run: make deps

      - name: 生成 Go 测试覆盖率（Cobertura）
        run: make cover-go-cobertura

      - name: 上传 Go 覆盖率到 Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: go

      - name: 生成前端测试覆盖率
        run: make cover-node # 产出 cmd/frontend/coverage/lcov.info

      - name: 上传前端覆盖率到 Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./cmd/frontend/coverage/lcov.info
          flag-name: node
