# fnmusic-sync 配置示例
# 复制为 /etc/fnmusic-sync/config.yaml 并按需修改。
# 无需环境变量，全部配置都在本文件内。
# 运行时修改本文件会被自动热加载（viper WatchConfig），无需重启即可生效（如增删用户、改凭证、调日志级别）。

server:
  socket_mode: 0 # 0 = 沿用官方 socket 权限（至少 0666）
  upstream_wait: 30s # 启动时等待官方后端就绪的超时

# 本地音乐文件目录（解析音频标签中的 MBID，建立「MBID ↔ 飞牛 GUID」映射）。
# 数组形式，可配置多个目录（音乐分布在不同位置时）。
# 目录必须是 fnmusic-sync 能直接读到的路径：
#   - 本工具运行在 fnOS(NAS) 本机：填飞牛曲库真实路径（如 /media/音乐）。
#   - 运行在其他机器：需先挂载 NAS 的 SMB/NFS 共享，填挂载点路径。
# 留空或注释掉则不解析文件标签，MBID 匹配退化为「艺人名+曲名」。
library:
  directories:
    - /path/to/music
    # - /mnt/nas/music2
    # - /mnt/nas/music3
  # MBID 本地扫描的去抖间隔（避免每次用户识别/定时同步都全量遍历音乐目录）。
  # 支持 Go 时长格式：300s、10m、6h、24h。空或非法值回退到 6h，限制在 [1m, 24h]。
  scan_interval: 6h

# 每个用户各自配置自己的 Last.fm / ListenBrainz 账号（多用户隔离）。
# key 必须与飞牛 /user/me 返回的用户名一致（从日志“识别到用户 用户名=xxx”确认）。
users:
  admin:
    lastfm:
      enabled: false
      api_key: ''
      api_secret: ''
      # session_key 留空时：程序启动会打印一个 Last.fm 授权链接到日志，
      # 在浏览器打开并点「同意」后，程序自动把 session_key 写回本文件并热加载生效，无需手动填。
      # 也可手动填写用户授权后获得的会话密钥（auth.getSession 换取）。
      session_key: '' # 用户授权后获得的会话密钥
      # username 留空时：授权成功后程序自动从 Last.fm 获取并写回。
      # 也可手动填写 Last.fm 用户名（歌单同步需要）。
      username: '' # Last.fm 用户名
      # Last.fm 智能歌单同步配置（需要 username + api_key）
      # 基于 scrobble 数据自动生成歌单同步到飞牛音乐
      playlist:
        top_tracks:
          enabled: false
          name: 'LF {period} 最常听' # 飞牛音乐中的歌单名称
          period: overall # 统计周期：7day / 1month / 3month / 6month / 12month / overall
          limit: 50 # 最多同步曲目数，0=不限制（Last.fm 上限 1000）
        loved_tracks:
          enabled: false
          name: 'LF 红心收藏'
          limit: 50 # 0=不限制（上限 1000）
        recent_tracks:
          enabled: false
          name: 'LF 最近播放'
          limit: 50 # 0=不限制（上限 200）
        weekly_charts:
          enabled: false
          name: 'LF 本周榜单' # Last.fm weeklytrackchart
          limit: 50 # 0=不限制（上限 1000）
        library:
          enabled: false
          name: 'LF 我的曲库' # Last.fm library.getTracks（基于 scrobble 历史）
          limit: 50 # 0=不限制（上限 1000）
    listenbrainz:
      enabled: false
      token: '' # ListenBrainz 用户 Token（scrobble 只认这个）
      # username 留空时：程序启动时自动调用 /1/validate-token 获取用户名并写回本文件。
      # 也可手动填写 ListenBrainz 用户名（歌单同步需要）。
      username: '' # ListenBrainz 用户名
      # 歌单同步配置（需要 username）
      # 开启前请确保：
      #   1. 已在 ListenBrainz 上关注 troi-bot（获取 daily-jams 必须）
      #      关注链接：https://listenbrainz.org/user/troi-bot/
      #   2. 音乐文件有 MBID 标签（用于匹配歌曲）
      playlist:
        daily_jams:
          enabled: false
          name: 'LB 每日推荐' # 飞牛音乐中的歌单名称
          limit: 50 # 最多同步曲目数，0=不限制（使用歌单全量）
        weekly_jams:
          enabled: false
          name: 'LB 每周推荐'
          limit: 50
        weekly_exploration:
          enabled: false
          name: 'LB 每周探索'
          limit: 50
        # 年度歌单（ListenBrainz 每年自动生成）
        year_discoveries:
          enabled: false
          name: 'LB {year} 年度发现' # {year} 会自动替换为真实年份，如 "LB 2025 年度发现"
          limit: 50
        year_missed:
          enabled: false
          name: 'LB {year} 年度遗珠' # {year} 会自动替换为真实年份，如 "LB 2025 年度遗珠"
          limit: 50
        # 统计类歌单（基于收听数据，非 troi-bot 推荐）
        top_recordings:
          enabled: false
          name: 'LB 最常听' # 飞牛音乐中的歌单名称
          limit: 50 # 0=不限制（使用 LB 全量）
          range: all_time # 统计维度：week / month / quarter / half_year / year / all_time / this_year
        recently_played:
          enabled: false
          name: 'LB 最近在听' # 基于 ListenBrainz listens 收听记录
          limit: 50 # 0=不限制
  # 第二个用户示例（去掉注释即可）：
  # alice:
  #   lastfm:
  #     enabled: true
  #     api_key: "xxxx"
  #     api_secret: "xxxx"
  #     session_key: "xxxx"
  #     username: "alice"       # Last.fm 用户名
  #     playlist:
  #       top_tracks:
  #         enabled: true
  #         name: "LF {period} TopTracks"
  #         period: 7day
  #         limit: 50
  #       loved_tracks:
  #         enabled: true
  #         name: "Last.fm LovedTracks"
  #         limit: 50
  #       recent_tracks:
  #         enabled: false
  #         name: "Last.fm RecentTracks"
  #         limit: 50
  #   listenbrainz:
  #     enabled: false
  #     token: ""
  #     username: ""
  #     playlist:
  #       daily_jams:
  #         enabled: true
  #         name: "ListenBrainz Daily Jams"
  #         limit: 50
  #       weekly_jams:
  #         enabled: true
  #         name: "ListenBrainz Weekly Jams"
  #         limit: 50
  #       weekly_exploration:
  #         enabled: true
  #         name: "ListenBrainz Weekly Exploration"
  #         limit: 50
  #       year_discoveries:
  #         enabled: true
  #         name: "LB {year} Year Discoveries"
  #         limit: 50
  #       year_missed:
  #         enabled: true
  #         name: "LB {year} Year Missed"
  #         limit: 50

playback:
  # 触发 scrobble（记录到 Last.fm / ListenBrainz）的进度阈值：
  #   auto        默认。听满 min(歌曲时长/2, 4分钟) 才记（Last.fm 官方规则）。
  #   30s / 2m    固定时长阈值（如 30s：每首歌播满 30 秒即记，便于快速验证）。
  #   50% / 0.5   按歌曲时长比例（50% = 播到一半）。
  #   off         关闭判断，每次播放（收到 track_play）即推送，不判断进度。
  #               注意：不符合 Last.fm “听满半曲/4分钟” 规范，试听、切歌也会记；
  #               日常使用建议 auto 或 30s，off 仅用于快速验证。
  # 修改本值会即时热加载，无需重启。
  scrobble_threshold: auto

playlist:
  enabled: true # 歌单同步总开关
  sync_interval: 30m # 同步间隔（检查所有用户的歌单更新）

logging:
  enabled: false
  level: info # info / debug
  # 日志固定写入 /var/log/fnmusic-sync/fnmusic-sync.log（目录与文件名不可配），
  # 同时输出到控制台(stderr)；目录不可写时自动降级为仅控制台。
  # 下面只控制「轮转」：
  max_size: 3 # 单文件超过 3MB 自动切割（0 = 不按大小切割）
  max_backups: 5 # 只保留最近 5 份历史日志（0 = 不限份数）
  max_age: 7 # 历史日志保留 7 天（0 = 不按时间过期）
  compress: true # 切割后的历史日志自动 gzip 压缩（.gz）


# 用户状态（是否启用各平台、累计推送次数、最近推送时间、用户列表与平台绑定）
# 由程序自动维护在内置数据库 state.db 中（路径由运行模式自动决定），无需在此手写。
# 曲目 MBID 映射等「数据」单独维护在 data.db（与 state.db 分离）。
