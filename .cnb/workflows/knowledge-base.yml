  issue.open:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
          options:
            # 指定需要包含的文件，使用 Glob 模式匹配，默认为 **/**.md， 支持数组或逗号分隔
            include:
