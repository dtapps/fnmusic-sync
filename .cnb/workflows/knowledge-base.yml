# 知识库构建
# https://docs.cnb.cool/zh/ai/knowledge-base.html
# https://docs.cnb.cool/zh/build/internal-steps/knowledge/update.html
'**':
  push:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          allowFailure: true
          settings:
            # 指定需要包含的文件，使用 Glob 模式匹配，默认为 **/**.md， 支持数组或逗号分隔
            include:
              - '**/**.md'
            # 是否启用 Issue 同步功能
            issueSyncEnabled: true
            # 是否忽略文档处理失败
            ignoreProcessFailures: true
  tag_push:
    - stages:
        - name: 知识库构建
          image: cnbcool/knowledge-base
          allowFailure: true
          settings:
            # 指定需要包含的文件，使用 Glob 模式匹配，默认为 **/**.md， 支持数组或逗号分隔
            include:
              - '**/**.md'
            # 是否启用 Issue 同步功能
            issueSyncEnabled: true
            # 是否忽略文档处理失败
            ignoreProcessFailures: true

$:
