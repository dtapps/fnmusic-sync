version: '2'
sql:
  - engine: 'sqlite'
    queries: 'queries.sql'
    schema: 'schema.sql'
    gen:
      go:
        package: 'datadb'
        out: '.'
        sql_package: 'database/sql'
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        # 运行时用 modernc.org/sqlite 驱动（driver 名 "sqlite"），无需 CGO。
        # 生成的代码仅依赖 database/sql，driver 在打开 DB 时指定。
