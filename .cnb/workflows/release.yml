'**':
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_build_go_project:
    - runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        build: .cnb/Dockerfile # 使用自定义 Dockerfile
        volumes:
          - /root/.cache/go-build:copy-on-write # 挂载 Go
          - /go:copy-on-write # 挂载项目依赖目录（可选，根据需要）
      imports: https://cnb.cool/dtapp/envs/-/blob/main/update.yml # 导入外部环境变量/配置
      stages:
        - name: 处理版本号与预发布选项
          script: |
            echo "原始 version: $version"

            # 1. 如果输入没有 v 前缀，自动加上
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi

            echo "处理 version: $version"

            # 2. 通过 set-output 输出到 result
            echo "##[set-output interior_version=$version]"

            # 3. 预发布选项：由页面 switch 传入 pre_release（true/false），默认 false
            pre_release="${pre_release:-false}"
            if [ "$pre_release" != "true" ] && [ "$pre_release" != "false" ]; then
              echo "警告：pre_release 值为 '${pre_release}'，仅支持 true/false，已回落到 false"
              pre_release="false"
            fi
            echo "preRelease: $pre_release"

            # 4. 通过 set-output 输出预发布选项
            echo "##[set-output pre_release=$pre_release]"
          exports:
            interior_version: INTERIOR_VERSION
            pre_release: PRE_RELEASE

        - name: 安装依赖
          script: make deps

        - name: 打包 Linux 安装包（deb/fpk）
          script: VERSION=${INTERIOR_VERSION} REPO_SOURCE=cnb CNB_TOKEN="$FNMUSIC_SYNC_TOKEN" make package-linux-all

        - name: 清理二进制文件 + .tar.gz 压缩包
          script: make clean-archives

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/changelog.html
        - name: 生成 Release 日志
          image: cnbcool/changelog
          allowFailure: true # 仓库首个 tag 时 changelog 插件无法生成日志，允许该 job 失败继续发布
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        - name: 生成 Release 正文
          script: |
            CNB_BASE="${CNB_REPO_URL_HTTPS%/}/-"
            DL_BASE="${CNB_BASE}/releases/download/${INTERIOR_VERSION}"

            if [ "${PRE_RELEASE}" = "true" ]; then
              RELEASE_TYPE="🚧 预发布版本 (Pre-release)"
            else
              RELEASE_TYPE="✅ 正式发布版本 (Stable)"
            fi
            BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            {
              if [ "${PRE_RELEASE}" = "true" ]; then
                echo "## ⚠️ 预发布版本"
                echo ""
                echo "> 这是预发布版本，可能包含未充分测试的功能。"
                echo "> 如需稳定版本，请使用 [正式发布](${CNB_BASE}/releases)。"
                echo ""
              fi

              echo "## 发布信息"
              echo ""
              echo "| 项目 | 内容 |"
              echo "| --- | --- |"
              echo "| 版本号 | ${INTERIOR_VERSION} |"
              echo "| 发布类型 | ${RELEASE_TYPE} |"
              echo "| 是否预发布 | ${PRE_RELEASE} |"
              echo "| 构建时间 | ${BUILD_TIME} |"
              echo ""
              echo "## 下载"
              echo ""
              echo "| 平台 | 架构 | 文件 | 大小 | 说明 |"
              echo "|------|------|------|------|------|"

              for f in bin/*; do
                [ -e "$f" ] || continue
                [ -d "$f" ] && continue
                fname=$(basename "$f")
                [ "$fname" = "SHA256SUMS" ] && continue
                fsize=$(ls -lh "$f" | awk '{print $5}')

                PLAT="Linux"
                ARCH="-"
                DESC="其它"
                case "$fname" in
                  *.deb)
                    ARCH="${fname#fnmusic-sync_}"; ARCH="${ARCH%.deb}"
                    DESC="Debian/Ubuntu 安装包" ;;
                  *.fpk)
                    ARCH="${fname#fnmusic-sync-}"; ARCH="${ARCH%.fpk}"
                    DESC="飞牛 fnOS 应用包" ;;
                esac

                echo "| ${PLAT} | ${ARCH} | [${fname}](${DL_BASE}/${fname}) | ${fsize} | ${DESC} |"
              done

              echo ""
              echo "## 更新内容"
              echo ""
              echo "${LATEST_CHANGE_LOG}"
            } > release_body.md

            cat release_body.md

        # 生成 Release 选项文件（preRelease 按传入值动态设置），供 git:release 的 optionsFrom 引用
        - name: 生成 Release 选项文件
          script: |
            cat > release_options.yml << EOF
            tag: ${INTERIOR_VERSION}
            title: "${INTERIOR_VERSION}"
            descriptionFromFile: release_body.md
            preRelease: ${PRE_RELEASE}
            EOF

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 发布 Release
          type: git:release
          optionsFrom: release_options.yml

        # 生成 fnpack releases 信息（自动计算 size/sha256，并合并历史版本），随后复制为 fnpack.json 随 bin/* 上传
        - name: 生成 fnpack releases 信息（自动计算 size/sha256，并合并历史版本）
          script: |
            set -eu
            VER="${INTERIOR_VERSION#v}"
            VVER="${INTERIOR_VERSION}"
            SRC="fnpack/cnb-source.json"
            CNB_BASE="${CNB_REPO_URL_HTTPS%/}/-"
            REPO_URL="${CNB_REPO_URL_HTTPS}"
            DL_RELEASES_BASE="${CNB_BASE}/releases/download"

            # 1. 计算本次 fpk 的 size/sha256
            amd_fpk="bin/fnmusic-sync-amd64.fpk"
            arm_fpk="bin/fnmusic-sync-arm64.fpk"
            [ -f "$amd_fpk" ] || { echo "缺少 $amd_fpk"; exit 1; }
            [ -f "$arm_fpk" ] || { echo "缺少 $arm_fpk"; exit 1; }

            amd_size=$(stat -c%s "$amd_fpk")
            amd_sha=$(sha256sum "$amd_fpk" | cut -d' ' -f1)
            arm_size=$(stat -c%s "$arm_fpk")
            arm_sha=$(sha256sum "$arm_fpk" | cut -d' ' -f1)

            # 2. 从历史 release 的 fnpack.json 提取旧 releases（新→旧，取第一个含该附件的版本）
            #    上一次发布可能没有 fnpack.json（如首次启用本功能），此时保持空对象即可。
            PREV_RELEASES='{}'
            TAGS=$(git tag --sort=-v:refname 2>/dev/null | grep -vx "v${VER}" | head -20 || true)
            if [ -z "$TAGS" ]; then
              TAGS=$(git ls-remote --tags --refs "$REPO_URL" 2>/dev/null \
                | awk '{print $2}' | sed 's#refs/tags/##' | grep -vx "v${VER}" | sort -Vr | head -20 || true)
            fi
            for tag in $TAGS; do
              tmp="$(mktemp)"
              if curl -fsSL -m 30 "${DL_RELEASES_BASE}/${tag}/fnpack.json" -o "$tmp" 2>/dev/null \
                && jq -e '.apps["fnmusic-sync"].releases' "$tmp" >/dev/null 2>&1; then
                PREV_RELEASES=$(jq -c '.apps["fnmusic-sync"].releases // {}' "$tmp")
                echo "已从历史 release 获取旧 releases（tag=${tag}）"
                rm -f "$tmp"
                break
              fi
              rm -f "$tmp"
            done
            if [ "$PREV_RELEASES" = "{}" ]; then
              echo "未找到历史 fnpack.json，仅写入本次版本"
            fi

            # 3. 合并旧 releases + 本次版本（本次优先），写回源文件
            jq --arg ver "$VER" \
               --argjson prev "$PREV_RELEASES" \
               --arg amd_url "${DL_RELEASES_BASE}/${VVER}/fnmusic-sync-amd64.fpk" \
               --argjson amd_size "$amd_size" \
               --arg amd_sha "$amd_sha" \
               --arg arm_url "${DL_RELEASES_BASE}/${VVER}/fnmusic-sync-arm64.fpk" \
               --argjson arm_size "$arm_size" \
               --arg arm_sha "$arm_sha" \
               '.apps["fnmusic-sync"].releases = ($prev + {
                  ($ver): {
                    "packages": {
                      "amd64": { "download_url": $amd_url, "size": $amd_size, "sha256": $amd_sha },
                      "arm64": { "download_url": $arm_url, "size": $arm_size, "sha256": $arm_sha }
                    }
                  }
                })' "$SRC" > "$SRC.tmp" && mv "$SRC.tmp" "$SRC"

            COUNT=$(jq '.apps["fnmusic-sync"].releases | length' "$SRC")
            echo "已更新 $SRC 的 releases（共 ${COUNT} 个版本）"
            jq -c '.apps["fnmusic-sync"].releases' "$SRC"

        # 复制 fnpack 源信息为 fnpack.json（统一附件名），随后由下方附件步骤随 bin/* 上传
        - name: 复制 fnpack 源信息为 fnpack.json（统一附件名）
          script: |
            cp "fnpack/cnb-source.json" "bin/fnpack.json"
            echo "已生成 bin/fnpack.json"

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - 'bin/*'
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
