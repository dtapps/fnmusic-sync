# 覆盖率上报到 Coveralls（独立工作流）
#
# 为什么独立：
#   - 与 Codecov 解耦：Coveralls 侧故障 / token 失效不会拖垮 Codecov 上传与测试 job；
#   - 凭证隔离：只用内置 GITHUB_TOKEN，不扩散到 Codecov 流程；
#   - Codecov 那条（.github/workflows/coverage.yml）已经跑通，不动它。
#
# 代价：本工作流会把测试再跑一遍（与 coverage.yml 重复）。这是「独立」换来的隔离性。
#
# 为什么是单个 job（而不是 go / node 拆两个 job）：
#   Coveralls 以 build 为单位聚合报告，go / node 两份报告必须落在同一个 build 里，
#   再靠 flag 合并；同一个 job 上传天然同 build。拆成两个 job 需要完整的
#   parallel + parallel-finished 协议，两侧混用不同上传器容易踩坑，
#   故这里保持单 job 顺序执行，换取确定性。
#
# 参考：
#   https://github.com/coverallsapp/github-action
name: Coveralls

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read # 拉取 GHCR 上的 CI 镜像

concurrency:
  group: coveralls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    # 复用预构建 CI 镜像
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        run: make deps

      - name: 生成 Go 测试覆盖率
        run: |
          gotestsum --junitfile go-test-report.xml -- -vet=off -coverpkg=$(go list ./... | grep -vE '/(db|datadb)$' | paste -sd, -) -coverprofile=coverage.out ./...

      - name: 上传 Go 覆盖率到 Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
          flag-name: go

      - name: 生成前端测试覆盖率
        working-directory: cmd/frontend
        run: pnpm test:coverage

      - name: 上传前端覆盖率到 Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./cmd/frontend/coverage/lcov.info
          flag-name: node
