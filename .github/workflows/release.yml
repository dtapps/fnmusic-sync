# 发布工作流
# 手动触发，输入版本号后自动构建 Linux 安装包并发布 GitHub Release
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/crazy-max/ghaction-upx
# https://github.com/golangci/golangci-lint-action
# https://github.com/sqlc-dev/setup-sqlc
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1；没有后缀就是正式版'
        required: true
        type: string

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 同一分支的多次运行取消旧的运行，避免排队浪费。
# ⚠️ 但 release 这一步不能跟着被砍：它不是幂等的一次性动作（建 tag → 传 4 个附件 →
# 写正文），取消在半路会留下一个只挂了两三个文件的 Release，比排队慢更贵。
# 跟 GitLab 那份的 interruptible: false 是同一个理由。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # 直接用预构建的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 免去每次重装系统库与 go install 工具。镜像由 ci-image.yml 在 Dockerfile 变动时
    # 自动重建并推送到 GHCR；首次使用前需先跑一次 ci-image.yml 让镜像存在。
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
    outputs:
      interior_version: ${{ steps.gen.outputs.interior_version }}
      pre_release: ${{ steps.gen.outputs.pre_release }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 解析版本号（预发布看后缀）
        id: gen
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "原始 version: [${VERSION}]"

          # 归一化 / 格式校验 / 预发布判定只有一份实现，在 scripts/ci/resolve-prerelease.sh，
          # 五个平台（CNB / GitHub / GitLab / Gitee / GitCode）都 source 它。
          # 只传版本号：预发布由 `-rc.1` / `-beta.1` / `-alpha.1` 这类后缀决定。
          # 以前那个 prerelease 布尔输入已经删掉 —— 它会跟版本号打架，而且打得毫无必要。
          # shellcheck disable=SC1091
          . scripts/ci/resolve-prerelease.sh

          echo "${PRE_NOTE}"
          echo "interior_version=${TAG}" >> "$GITHUB_OUTPUT"
          # 只在本 job 之间传，不再来自用户输入
          echo "pre_release=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # 构建 + 打包 Linux 安装包（deb/fpk）
  build:
    needs: prepare
    runs-on: ubuntu-latest
    # 直接用预构建的 CI 镜像（含 Go/Node/pnpm + GTK/WebKit + 全部 Go 工具链），
    # 免去每次重装系统库与 go install 工具。镜像由 ci-image.yml 在 Dockerfile 变动时
    # 自动重建并推送到 GHCR；首次使用前需先跑一次 ci-image.yml 让镜像存在。
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 容器镜像已预装 Go 工具链（GOPATH=/go，工具在 /go/bin 且已在 PATH），
      # 这里把路径常量写入 $GITHUB_ENV，供后续 make 步骤的 GOPATH/GOBIN 引用。
      # 无需再 apt 装 GTK/WebKit、setup-go/node、make tool-deps——镜像里都已就绪。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          echo "GO_PATH_DIR=/go" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=/go/bin" >> "$GITHUB_ENV"

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / go install
      # 命中已下载模块，避免重复从 proxy 拉取。镜像内 GOPATH=/go。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: ${{ env.GO_PATH_DIR }}/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: echo "PNPM_STORE_DIR=$(pnpm config get store-dir)" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store，按 lockfile hash 命中，pnpm install 命中后跳过从 registry 下载。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cmd/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装所有依赖
        shell: bash
        run: make deps

      - name: 打包 Linux 安装包（deb/fpk）
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.interior_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${VERSION} REPO_SOURCE=github GITHUB_TOKEN="${GITHUB_TOKEN}" make package-linux-all

      - name: 清理二进制文件 + .tar.gz 压缩包
        shell: bash
        run: make clean-archives

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: fnmusic-sync-release
          path: bin/*
          if-no-files-found: error
          retention-days: 1

  # 构建完成后，发布 GitHub Release
  release:
    needs: [build, prepare]
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          name: fnmusic-sync-release
          path: release

      - name: 生成 Release 正文
        shell: bash
        env:
          INTERIOR_VERSION: ${{ needs.prepare.outputs.interior_version }}
          PRE_RELEASE: ${{ needs.prepare.outputs.pre_release }}
        run: |
          REPO="${{ github.repository }}"
          DL_BASE="https://github.com/${REPO}/releases/download/${INTERIOR_VERSION}"

          if [ "${PRE_RELEASE}" = "true" ]; then
            RELEASE_TYPE="🚧 预发布版本 (Pre-release)"
          else
            RELEASE_TYPE="✅ 正式发布版本 (Stable)"
          fi
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # 生成 changelog（取上一个 tag 到 HEAD 的提交摘要）
          #
          # 不能写 `git tag --sort=-v:refname | head -2 | tail -1`：那是「全仓库第二新的 tag」，
          # 跟当前 HEAD 没有关系。重跑一次（tag 已经建过）就会把刚发的 tag 自己当成上一个版本，
          # 段落直接变成空；分支上多了个更新的 tag 时也会指到别的线上去。
          # HEAD^ 找的是「HEAD 之前最近的那个 tag」，与 GitLab 那份的 git describe 同一口径。
          PREV_TAG=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          {
            if [ "${PRE_RELEASE}" = "true" ]; then
              echo "## ⚠️ 预发布版本"
              echo ""
              echo "> 这是预发布版本，可能包含未充分测试的功能。"
              echo "> 如需稳定版本，请使用 [正式发布](https://github.com/${REPO}/releases)。"
              echo ""
            fi

            echo "## 发布信息"
            echo ""
            echo "| 项目 | 内容 |"
            echo "| --- | --- |"
            echo "| 版本号 | ${INTERIOR_VERSION} |"
            echo "| 发布类型 | ${RELEASE_TYPE} |"
            echo "| 是否预发布 | ${PRE_RELEASE} |"
            echo "| 构建时间 | ${BUILD_TIME} |"
            echo ""
            echo "## 下载"
            echo ""
            echo "| 平台 | 架构 | 文件 | 大小 | 说明 |"
            echo "|------|------|------|------|------|"

            for f in release/*; do
              [ -e "$f" ] || continue
              [ -d "$f" ] && continue
              fname=$(basename "$f")
              [ "$fname" = "SHA256SUMS" ] && continue
              fsize=$(ls -lh "$f" | awk '{print $5}')

              PLAT="Linux"
              ARCH="-"
              DESC="其它"
              case "$fname" in
                *.deb)
                  ARCH="${fname#fnmusic-sync_}"; ARCH="${ARCH%.deb}"
                  DESC="Debian/Ubuntu 安装包" ;;
                *.fpk)
                  ARCH="${fname#fnmusic-sync-}"; ARCH="${ARCH%.fpk}"
                  DESC="飞牛 fnOS 应用包" ;;
              esac

              echo "| ${PLAT} | ${ARCH} | [${fname}](${DL_BASE}/${fname}) | ${fsize} | ${DESC} |"
            done

            echo ""
            echo "## 更新内容"
            echo ""
            echo "${CHANGES}"
          } > release_body.md

          cat release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.interior_version }}
          name: ${{ needs.prepare.outputs.interior_version }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.pre_release }}
          body_path: release_body.md
          files: release/*
