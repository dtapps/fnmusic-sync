# 推送工作流
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
name: PushRequest

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# 同一分支的多次 push 取消旧的运行，避免排队浪费。
concurrency:
  group: push-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # ==========================================
    # 定义版本变量
    # https://github.com/golangci/golangci-lint/releases
    # ==========================================
    env:
      GOLANGCI_LINT_VERSION: '2.13.2'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version-file: 'go.mod'

      - name: 安装 Pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          package_json_file: 'cmd/frontend/package.json'
          cache_dependency_path: 'cmd/frontend/pnpm-lock.yaml'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          cache-dependency-path: 'cmd/frontend/pnpm-lock.yaml'
          node-version-file: 'cmd/frontend/.nvmrc'

      - name: 安装 golangci-lint 工具
        shell: bash
        run: |
          LINT_DIR="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          LINT_URL="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${LINT_DIR}.tar.gz"

          cd /tmp && \
          wget -q -O lint.tar.gz "${LINT_URL}" && \
          tar -xf lint.tar.gz && \
          sudo mv ${LINT_DIR}/golangci-lint /usr/local/bin/golangci-lint && \
          sudo chmod +x /usr/local/bin/golangci-lint && \
          rm -rf lint.tar.gz ${LINT_DIR} && \
          echo "--- golangci-lint installed ---" && \
          golangci-lint --version

      - name: 安装依赖
        run: make deps

      - name: 格式化（Go + 前端 + 配置 + 文档 + 脚本）
        run: make format

      - name: 检查（Go + HTML/CSS/JS/TS/Svelte）
        run: make check
