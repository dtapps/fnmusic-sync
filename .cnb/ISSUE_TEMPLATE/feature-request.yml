name: 功能建议
description: 提出新功能、体验改进或现有功能的调整建议
title: '[建议] '
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，并确认文档中还没有这个能力。

        这里只讨论产品需求，不处理安全漏洞；安全问题请按 [SECURITY.md](https://cnb.cool/dtapp/fnmusic-sync/-/blob/main/SECURITY.md) 私下报告，不要在此填写凭证或隐私数据。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前使用场景中的不便，以及建议能带来的改善。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望增加或改变什么？尽量说明触发入口、行为和配置方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: '可选。说明现有变通方法，以及为什么仍需要这个建议。'

  - type: textarea
    id: examples
    attributes:
      label: 示例与使用场景
      description: '可选。可用具体例子、界面草图或流程图说明。'
      render: text

  - type: textarea
    id: impact
    attributes:
      label: 兼容性与影响
      description: '可选。是否涉及配置迁移、数据格式、权限、部署方式或现有用户行为变化？'

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，且这不是重复建议
          required: true
        - label: 我确认提交内容不包含凭证或隐私数据
          required: true
