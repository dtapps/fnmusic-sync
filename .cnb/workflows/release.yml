# 发布流水线：版本门禁与发布主体各定义一份。
# 定时、页面手动与 API 三个入口都并行拉起这两条 pipeline；发布主体先 await 门禁，
# 门禁的 parse + validate 成功后才继续构建、打包与发布。
.version_gate: &version_gate
  name: 版本门禁
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  docker:
    image: docker.cnb.cool/dtapp/golang/fnpack:latest # 提供 Git 仓库与基础工具
  stages:
    - name: 解析版本号（预发布看后缀）
      image: docker.cnb.cool/dtapp/plugins/release-version:latest
      settings:
        mode: parse
        version: ${version}
        default_nightly: true
        fetch_tags: true
        nightly_fallback: error
      exports:
        tag: INTERIOR_VERSION
        prerelease: PRE_RELEASE

    - name: 校验版本号与 tag
      image: docker.cnb.cool/dtapp/plugins/release-version:latest
      settings:
        mode: validate
        version: ${INTERIOR_VERSION}
        fetch_tags: true
        allow_existing_nightly: false
      exports:
        validated: VERSION_VALIDATED
        latest_stable: LATEST_STABLE

    # 只在解析与校验都成功后通知；校验失败时发布主体的 await 会随门禁失败一起结束。
    - name: 通知版本门禁通过
      type: cnb:resolve
      options:
        key: fnmusic-sync-release-version-gate
        data:
          tag: ${INTERIOR_VERSION}
          prerelease: ${PRE_RELEASE}

.trigger_release: &trigger_release
  name: 发布
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  services:
    - docker # 启用 Docker 服务（用于 docker build/push）
  docker:
    image: docker.cnb.cool/dtapp/golang/fnpack:latest # 统一使用预构建的 CI 环境镜像
    volumes:
      - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
      - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
      - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
      - ./scripts/ci:copy-on-write # 模板脚本缓存；卷会整体挂载该目录，同步前需先还原跟踪文件
  # 导入外部环境变量/配置。多文件必须用 YAML 数组（逗号分隔字符串不生效）；
  # 同名变量后面的覆盖前面的，故项目专属的 fnmusic-sync.yml 放在通用 github.yml 之后。
  # npc.yml 提供 NPC_ENABLED：NPC 总开关，关闭时不发公告评论即不触发 NPC。
  imports:
    - https://cnb.cool/dtapp/envs/-/blob/main/github.yml
    - https://cnb.cool/dtapp/envs/-/blob/main/fnmusic-sync.yml
    - https://cnb.cool/dtapp/envs/-/blob/main/npc.yml
  # 公告评论的开关/内容：
  # - NPC_ENABLED：从 envs/npc.yml 导入的全局总开关，false 时所有 NPC 触发点都不工作；
  # - ANNOUNCEMENT_COMMENT_TEXT：评论正文，@ 本仓库自定义 NPC「发版日志助手」
  #   （在 .cnb/settings.yml 的 npc.roles 里定义，要求写在它的 prompt 里），
  #   只给出要对比的两个 tag；这里不再重复写要求，避免两处维护。
  #   @ 后的仓库路径用 {{REPOSLUG}}，发评论前替换成流水线注入的 CNB_REPO_SLUG，
  #   不写死 dtapp/certflow——仓库改名 / fork 后仍能 @ 到本仓库的角色。
  #
  # ⚠️ {{PREVIOUSTAG}} / {{CURRENTTAG}} / {{REPOSLUG}} 不是 CNB 的模板语法：env 里的值就是字面量，
  #   流水线不会替我们替换，直接发出去就是两个花括号。真实值在「发布公告评论」stage
  #   发评论前用 sed 换掉（基准 tag 由「准备发版公告」stage 调
  #   scripts/ci/resolve-prev-tag.sh 算出并落盘）。所以模板里**不要出现 | 和 &**：
  #   sed 用 | 当分隔符，& 在替换串里是特殊字符。
  env:
    GIT_SHIM_SAFE_DIRECTORY: 'true'
    ANNOUNCEMENT_COMMENT_TEXT: |-
      @{{REPOSLUG}}(发版日志助手) 请对比标签 {{PREVIOUSTAG}} 和 {{CURRENTTAG}} 的差异。
  stages:
    # 与「版本门禁」pipeline 配对：parse + validate 成功后才拿得到版本号，
    # 后续构建、打包、发布全部排在这一步之后。
    - name: 等待版本门禁
      type: cnb:await
      options:
        key: fnmusic-sync-release-version-gate
      exports:
        tag: INTERIOR_VERSION
        prerelease: PRE_RELEASE

    - name: 同步脚本
      script: |
        # 卷会整体挂载 scripts/ci，先把本次提交里跟踪的脚本还原（未跟踪的模板脚本由缓存/下载提供）
        git checkout -- scripts/ci
        make fetch-scripts

    - name: 安装全部 Go 依赖
      script: make deps-go

    - name: 安装全部前端依赖
      script: make deps-node

    - name: 打包 Linux 产物（tar.gz/deb/fpk）
      script: VERSION=${INTERIOR_VERSION} GORELEASER_CURRENT_TAG=${INTERIOR_VERSION} REPO_SOURCE=cnb CNB_TOKEN="$UPDATE_TOKEN"
        make goreleaser-release

    # 校验文件由 GoReleaser 生成 tar.gz/deb 部分，package-fpk.sh 在打完 fpk 后追加。
    # 正文的「校验」一节只在 dist/SHA256SUMS 存在时才写，这里再兜底确认各类包都在。
    - name: 校验校验文件
      script: |
        set -eu
        test -s dist/SHA256SUMS
        for f in dist/*.deb dist/*.fpk dist/fnmusic-sync-linux-*.tar.gz; do
          grep -qF "  ${f##*/}" dist/SHA256SUMS || {
            echo "❌ SHA256SUMS 缺少 ${f##*/}"
            exit 1
          }
        done
        cat dist/SHA256SUMS

    - name: 生成 Release 正文
      image: docker.cnb.cool/dtapp/plugins/release-changelog:latest
      settings:
        mode: release
        version: ${INTERIOR_VERSION}
        commit: ${CNB_COMMIT}
        artifact_dir: dist
        artifact_layout: single
        out_file: release_body.md
        fetch_tags: true
        fetch_history: true

    # 生成 Release 选项文件，供 git:release 的 optionsFrom 读取。
    #
    # 为什么用 JSON 而不是 YAML 插值：preRelease 的类型是严格的 Boolean
    # （对比 latest 明确允许 "true"|"false" 字符串），而变量替换产出的是字符串
    # "false"，字符串在布尔位置上容易被当成真值，导致正式版也被勾成预发布。
    # 走 optionsFrom 读到的是 JSON 里真正的布尔值，没有这个歧义。
    # descriptionFromFile 同理：正文里有反引号、管道符和换行，塞进插值里容易被转义毁掉。
    - name: 生成 Release 选项文件
      script: |
        set -eu
        # 空值写进配置后 git:release 会当成脏配置，报错还落在「发布」那一步，
        # 跟真正的原因隔了三屏。空就直接死在这一步。
        : "${INTERIOR_VERSION:?INTERIOR_VERSION 为空——第一步没跑成功}"
        : "${PRE_RELEASE:?PRE_RELEASE 为空——第一步没跑成功}"

        # 标题统一带项目名前缀（与 GitHub 的 release.yml 同口径，改名字要一起改）。
        # 用驼峰产品名而不是仓库 slug：Release 列表里「FnMusicSync v0.1.32」比
        # 「fnmusic-sync v0.1.32」更像一次发布，也更容易被用户认成产品名。
        project_name="FnMusicSync"

        if [ "${PRE_RELEASE}" = "true" ]; then
          release_title="${project_name} ${INTERIOR_VERSION} (预发布)"
          prerelease_json=true
        else
          release_title="${project_name} ${INTERIOR_VERSION}"
          prerelease_json=false
        fi

        printf '{\n  "tag": "%s",\n  "title": "%s",\n  "descriptionFromFile": "release_body.md",\n  "preRelease": %s\n}\n' \
          "${INTERIOR_VERSION}" "${release_title}" "${prerelease_json}" > ./.cnb-release-options.json
        cat ./.cnb-release-options.json

    # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
    - name: 发布 Release
      type: git:release
      # tag / title / preRelease / description 全部来自上一步写出的 JSON。
      # 版本号带 -rc / -beta / -alpha / -nightly 后缀才勾选「预发布」，正式版不勾，不接受人工输入。
      # tag 落在当前工作区的 HEAD 上，与本次构建的源码、产物保持一致。
      optionsFrom: ./.cnb-release-options.json

    # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
    - name: 上传 Release 附件
      image: cnbcool/attachments:latest
      settings:
        type: UPLOAD
        tag: ${INTERIOR_VERSION}
        attachments:
          - 'dist/*.deb'
          - 'dist/*.fpk'
          - 'dist/fnmusic-sync-linux-*.tar.gz'
          - 'dist/SHA256SUMS'
      exports:
        FILES: FILES

    - name: 输出 Release 附件
      script: echo $FILES

    # protect 保住正式版、latest/stable 与 rc/beta/alpha，避免 by_count 误删非 nightly 版本；
    # dry_run 必须显式为 false，否则插件默认只列出待删除版本。
    - name: 清理旧 nightly（只保留最近 3 个）
      image: docker.cnb.cool/dtapp/plugins/release-cleaner:latest
      allowFailure: true
      settings:
        mode: by_count
        keep: 3
        protect: '^(v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[.-]?[0-9A-Za-z.-]*)?|latest|stable)$'
        delete_git_tag: true
        dry_run: false

    # 发布成功后开一条「发版公告」Issue。
    #
    # CNB / GitHub 独立发布：CNB 在 Issue 发公告，GitHub 在 Discussions 发公告，
    # 两边各自渲染、各自创建，不再互相触发。
    #
    # 为什么用官方 cnbcool/cnb-cli 插件而不是自己拼 OpenAPI：
    # CNB 没有「创建 Issue」的内置步骤（git:issue-update 只能改状态 / 标签 / 处理人，
    # 既不能创建、也不能改标题与正文），能创建 Issue 的官方工具就是 cnb-cli 插件
    # （官方 OpenAPI 命令行工具，CNB_TOKEN 由流水线自动注入）。
    #
    # ⚠️ 命令形态（v1.23.5 实测）：模块 / 工具用「位置参数」（cnb issues create-issue），
    # 选项用 --repo / --title / --body-file / --labels / --number / --state 这类长选项；
    # 不要写 cnb --module issues --tool create-issue——v1.23.5 的解析器会把 --module
    # 当成位置参数，报「工具函数 --module/issues 不存在」。
    #
    # 为什么拆成两个 stage：
    # - 「准备发版公告」跑在默认镜像里：只负责渲染正文与标题（不碰网络）；
    # - 「创建发版公告」「发布公告评论」跑在官方 CLI 镜像里：image 是任务级环境
    #   （见 CNB 文档「构建环境」），不会影响同一条流水线里其它 stage 用的镜像。
    #
    # 为什么失败不阻断：这一步跑在 Release 与附件都上传完之后，发布已经完成，公告失败只告警。
    - name: 准备发版公告
      # 公告链路（准备 → 创建 → 评论）共用的 if：CNB 的 if 是一段 shell 脚本，退出码 0 才跑该 stage。
      # 1) 排除 nightly：每天一个 tag，每天开一条公告会把 Issue 列表刷成日报；
      # 2) NPC 总开关：NPC_ENABLED 关闭时整条链路都不执行，不发评论、不触发 NPC。
      if: &announce_if |
        case "${INTERIOR_VERSION}" in
          *-nightly.*) exit 1 ;;
          *) exit 0 ;;
        esac
        case "$(printf '%s' "${NPC_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')" in
          0 | false | no | off) exit 1 ;;
          *) exit 0 ;;
        esac
      script: |
        set -eu

        VERSION="${INTERIOR_VERSION}"
        PRERELEASE="${PRE_RELEASE}"
        WEB_BASE="${CNB_REPO_URL_HTTPS%/}/-"

        # 公告正文与 Release 正文同源：下载表 / 校验 / 更新内容都取自 release_body.md，
        # 不在这里另编一套（格式见 scripts/ci/render-announcement-body.sh）。
        if [ ! -f scripts/ci/render-announcement-body.sh ]; then
          echo "⚠️ 缺少 scripts/ci/render-announcement-body.sh，跳过公告"
          exit 0
        fi

        export VERSION PRERELEASE
        export RELEASE_BODY="release_body.md"
        export OUT_FILE="announcement_body.md"
        export TITLE_FILE="announcement-title.txt"
        export CNB_WEB_BASE="${WEB_BASE}"
        export GITHUB_WEB="https://github.com/dtapps/fnmusic-sync"
        export STABLE_URL="${WEB_BASE}/releases/latest"
        # HEAD 即本次发布使用的触发提交。
        export COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"

        # 公告评论要指明「对比哪两个 tag」。基准必须和 Release 正文同口径（正式版对比
        # 上一个正式版，不掺 rc/beta），所以直接调 resolve-prev-tag.sh —— 它是正文
        # （release-changelog.sh）与这里共用的唯一一份判定，别另写一套 tag 排序。
        #
        # 补一次 tag 拉取：当前克隆不保证包含完整 tag 历史。
        # 加 --force 是为了覆盖被改动过的旧 tag；失败不阻断
        # （取不到就退回「按公告正文改写」）。
        # 故意不加 --depth：给一个完整克隆的仓库加 --depth 反而会把它变浅、截掉历史。
        git fetch --tags --quiet --force >/dev/null 2>&1 || true
        PREV_TAG="$(sh scripts/ci/resolve-prev-tag.sh "${VERSION}" 2>/dev/null || true)"
        # 落盘给下一步（评论 stage 跑在 cnb-cli 镜像里，不保证有 git，也不该重算一遍）。
        printf '%s' "${PREV_TAG}" > announcement-prev-tag.txt
        echo "对比基准 tag：${PREV_TAG:-（无，评论将按公告正文改写）}"

        # 渲染失败也不让发布流水线变红：正文渲染不出来只是少一条公告，只告警跳过。
        # 后面的步骤读不到标题会自动跳过（创建 stage 有缺失检查）。
        if ! sh scripts/ci/render-announcement-body.sh > /dev/null; then
          echo "⚠️ 生成公告正文失败，跳过发版公告"
          exit 0
        fi
        echo "公告正文已生成：${OUT_FILE}（标题见 ${TITLE_FILE}）"

    # 用官方 cnbcool/cnb-cli 插件创建 / 更新公告 Issue。
    #
    # Issue 一旦建出来就删不掉，所以这里严格「先查后改」：
    # 按标题找出所有同版本的公告，第一个更新、其余（历史重复）关掉。
    - name: 创建发版公告
      image: cnbcool/cnb-cli
      if: *announce_if
      script: |
        set -eu

        REPO="${CNB_REPO_SLUG}"
        KEYWORD="${INTERIOR_VERSION}"
        LABEL="发版公告"
        BODY="announcement_body.md"

        TITLE="$(cat announcement-title.txt 2>/dev/null || echo '')"
        if [ -z "${TITLE}" ] || [ ! -f "${BODY}" ]; then
          echo "⚠️ 缺少公告标题或正文，跳过"
          exit 0
        fi

        # 1) 先把标签建好：仓库里没有「发版公告」这个标签时，带标签建 Issue 会被拒。
        #    标签已存在时接口报 400、CLI 退出码非 0，忽略即可。
        cnb repo-labels post-label \
          --repo "${REPO}" \
          --name "${LABEL}" \
          --color "1677ff" \
          --description "FnMusicSync 发版公告" \
          > /dev/null 2>&1 || echo "（标签可能已存在，忽略）"

        # 2) 先查：open / closed 各查一次（官方接口的 state 只列了 open 与 closed）。
        #    已关闭的公告也算「已经创建过」，照样更新，不能因为关了再建一条。
        for issue_state in open closed; do
          cnb issues list-issues \
            --repo "${REPO}" \
            --state "${issue_state}" \
            --keyword "${KEYWORD}" \
            --page 1 \
            --page-size 50 \
            > "announcement-list-${issue_state}.txt" 2>&1 || true
        done

        # 3) 从 CLI 输出里找「标题完全一致」的所有公告（不 exit：可能有多条历史重复）。
        #    输出是 util.inspect 风格（对象属性逐行），按「上一个 number 行 + 当前 title 行」配对；
        #    number 是字符串（官方 schema: type string，可能带引号），title 值也被引号包着，
        #    两边都先剥掉引号/逗号再比较，否则 v1.2.3 会误匹配 v1.2.30。
        numbers="$(cat announcement-list-open.txt announcement-list-closed.txt 2>/dev/null | awk -v t="${TITLE}" '
          /^[[:space:]]*(-[[:space:]]+)?number: / { v = $NF; gsub(/[^0-9]/, "", v); if (v != "") n = v }
          /^[[:space:]]*(-[[:space:]]+)?title: / {
            line = $0
            sub(/^[[:space:]]*(-[[:space:]]+)?title: /, "", line)
            gsub(/^[",]+|[",]+$/, "", line)
            if (line == t && n != "") print n
          }
        ' | sort -un || true)"

        if [ -n "${numbers}" ]; then
          number="$(printf '%s\n' "${numbers}" | head -1)"
          echo "已存在同版本公告（#${number}），改写正文"
          if cnb issues update-issue \
            --repo "${REPO}" \
            --number "${number}" \
            --title "${TITLE}" \
            --body-file "${BODY}" \
            > announcement-result.txt 2>&1; then
            echo "✓ 已更新发版公告 #${number}"
          else
            echo "⚠️ 更新发版公告失败，请手工改一下："
            cat announcement-result.txt 2>/dev/null || true
          fi

          # 同版本有多条时（历史上幂等失效留下的），**逐条更新成同一份内容**。
          # 不关闭任何一条：公告是给用户看的，关掉反而像「这个版本被撤了」。
          for other in $(printf '%s\n' "${numbers}" | tail -n +2); do
            if cnb issues update-issue \
              --repo "${REPO}" \
              --number "${other}" \
              --title "${TITLE}" \
              --body-file "${BODY}" \
              > /dev/null 2>&1; then
              echo "已同步更新同版本公告 #${other}"
            else
              echo "⚠️ 同步更新同版本公告 #${other} 失败，请手工处理"
            fi
          done

          # 编号落盘：下一步（发评论）要用它定位公告。
          printf '%s' "${number}" > announcement-number.txt
          exit 0
        fi

        echo "创建发版公告：${TITLE}"
        # CLI 的退出码就是结果：0 成功，3 = HTTP / 网络错误（输出里有 status: 400 等详情）。
        if cnb issues create-issue \
          --repo "${REPO}" \
          --title "${TITLE}" \
          --body-file "${BODY}" \
          --labels "${LABEL}" \
          > announcement-result.txt 2>&1; then
          echo "✓ 已创建发版公告"
        else
          # 仓库里还没有「发版公告」这个标签时，带标签创建会被拒；
          # 去掉标签再试一次，公告本身仍然发得出去。
          echo "带标签创建失败，去掉标签重试"
          if cnb issues create-issue \
            --repo "${REPO}" \
            --title "${TITLE}" \
            --body-file "${BODY}" \
            > announcement-result.txt 2>&1; then
            echo "✓ 已创建发版公告"
          else
            echo "⚠️ 创建发版公告失败，请手工补一条："
            cat announcement-result.txt 2>/dev/null || true
          fi
        fi

        # 把 Issue 编号落盘：下一步（发评论）要用它定位公告。
        # number 是字符串（可能带引号），.? 吃掉引号再取数字。
        issue_number="$(grep -oE 'number: .?[0-9]+' announcement-result.txt 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)"
        if [ -n "${issue_number}" ]; then
          printf '%s' "${issue_number}" > announcement-number.txt
          echo "公告 Issue 编号：${issue_number}（已落盘，下一步用它发评论）"
        else
          echo "⚠️ 公告已创建但没解析到 Issue 编号，评论会跳过；下面是原始输出："
          head -20 announcement-result.txt 2>/dev/null || true
        fi

    # 在公告 Issue 上追加一条评论：把「整理一份用户友好的更新日志」交给本仓库自定义 NPC
    # 「发版日志助手」（.cnb/settings.yml 的 npc.roles 里定义）去做，它会把整理好的日志作为评论发回来。
    #
    # NPC 总开关 NPC_ENABLED 来自 imports 的 npc.yml，由公告链路共用的 if 判断（见「准备发版公告」）：
    # 关闭则准备/创建/评论三个 stage 全部不执行，不触发 NPC。评论内容在 job 级 env 的
    # ANNOUNCEMENT_COMMENT_TEXT 里（只放提示语本身，不夹带更新内容——要求写在角色的 prompt 里）。
    #
    # 提示语里的 {{PREVIOUSTAG}} / {{CURRENTTAG}} / {{REPOSLUG}} 由本 stage 替换成真实值：
    #   - CURRENTTAG 就是本次发布的 tag（INTERIOR_VERSION）；
    #   - PREVIOUSTAG 来自「准备发版公告」落盘的 announcement-prev-tag.txt，
    #     取不到（首次发这个渠道 / 补发历史版本）就换成一句文字说明，
    #     NPC 那边会退回「按公告正文改写」，不会拿着假 tag 去 diff；
    #   - REPOSLUG 用流水线注入的 CNB_REPO_SLUG，保证 @ 到本仓库的角色（改名 / fork 后仍有效）。
    - name: 发布公告评论
      image: cnbcool/cnb-cli
      if: *announce_if
      script: |
        set -eu

        REPO="${CNB_REPO_SLUG}"

        # 公告 Issue 的编号由「创建发版公告」落盘；没有编号说明公告没建成。
        NUMBER="$(cat announcement-number.txt 2>/dev/null || echo '')"
        if [ -z "${NUMBER}" ]; then
          echo "没有公告 Issue 编号（公告未创建或已被跳过），不追加评论"
          exit 0
        fi

        # 先替换占位符再落盘：env 里的 {{...}} 只是字面量，不替换就会原样发出去。
        # sed 用 | 作分隔符、& 在替换串里是特殊字符，所以模板里不允许出现这两个字符
        # （tag 已被 resolve-prerelease.sh 的字符白名单约束：只有 [0-9A-Za-z._+-]；
        #   repo slug 形如 dtapp/fnmusic-sync，同样不含 | 和 &）。
        CUR_TAG="${INTERIOR_VERSION}"
        PREV_TAG="$(cat announcement-prev-tag.txt 2>/dev/null || true)"
        [ -n "${PREV_TAG}" ] || PREV_TAG='（首个版本，无对比基准）'

        # 评论内容只放提示语本身，不夹带更新内容：要求写在角色 prompt 里，NPC 自己会读上面那条公告。
        printf '%s' "${ANNOUNCEMENT_COMMENT_TEXT:-}" \
          | sed "s|{{PREVIOUSTAG}}|${PREV_TAG}|g; s|{{CURRENTTAG}}|${CUR_TAG}|g; s|{{REPOSLUG}}|${REPO}|g" \
            > announcement-comment.md
        if [ ! -s announcement-comment.md ]; then
          echo "⚠️ 评论内容为空（ANNOUNCEMENT_COMMENT_TEXT），不追加评论"
          exit 0
        fi

        # 幂等：评论发出去也删不掉，重跑时先看这条公告下有没有同样的评论，有就不重复发。
        # 用评论正文的第一行做标记（默认提示语是单行；多行文案请保证首行唯一）。
        MARK="$(head -1 announcement-comment.md)"
        if [ -z "${MARK}" ]; then
          echo "⚠️ 评论第一行为空，无法做重复检查，直接发布"
        else
          cnb issues list-issue-comments \
            --repo "${REPO}" \
            --number "${NUMBER}" \
            --sort -created \
            --page-size 30 \
            > announcement-comment-list.txt 2>&1 || true

          if ! grep -q 'status: 2' announcement-comment-list.txt 2>/dev/null; then
            # 列表查不出来就没法判断「发过没」：宁可发一次（NPC 才会动），但要留痕。
            echo "⚠️ 查询已有评论失败，无法确认是否发过；仍会发布，请留意是否重复"
            cat announcement-comment-list.txt 2>/dev/null || true
          elif grep -qF -- "${MARK}" announcement-comment-list.txt 2>/dev/null; then
            echo "✓ 公告 #${NUMBER} 已有同样的评论，跳过（评论删不掉，不重复发）"
            exit 0
          fi
        fi

        if cnb issues post-issue-comment \
          --repo "${REPO}" \
          --number "${NUMBER}" \
          --body-file announcement-comment.md \
          > announcement-comment-result.txt 2>&1; then
          echo "✓ 已在公告 #${NUMBER} 上发布评论"
        else
          echo "⚠️ 发布公告评论失败，请手工补一条评论："
          cat announcement-comment-result.txt 2>/dev/null || true
        fi

main:
  # 每天北京时间 00:00（Asia/Shanghai）构建 nightly 预发布。
  'crontab: 0 0 * * *':
    - *version_gate
    - *trigger_release

  # 手动触发：通过页面自定义按钮执行（预发布看版本号后缀）。
  web_trigger_release:
    - *version_gate
    - *trigger_release

  # API 触发：调用 CNB Open API，以 event=api_trigger_release 触发，
  # 通过请求体 env 传 version（如 v1.2.3 / v1.2.3-rc.1 / v1.2.3-nightly.20260101）；
  # 不传 version 时按 nightly 构建（见「解析版本号」stage）。
  # 预发布标记一律由版本号后缀推导，不再接受 pre_release 输入。
  api_trigger_release:
    - *version_gate
    - *trigger_release
