<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞牛音乐 Scrobble 代理</title>
<link rel="stylesheet" href="{{.BaseURL}}/style.css">
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-left">
      <img src="{{.BaseURL}}/images/icon_256.png" alt="logo" class="logo" onerror="this.style.display='none'">
      <div>
        <h1>飞牛音乐 Scrobble 代理</h1>
        <p class="version" id="version">版本加载中...</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="users">用户配置</button>
      <button class="tab admin-only" data-tab="settings">全局设置</button>
      <button class="tab" data-tab="state">运行状态</button>
      <button class="tab admin-only" data-tab="logs">日志</button>
    </nav>
  </header>

  <!-- 用户配置 -->
  <section id="tab-users" class="tab-content active">
    <div class="toolbar">
      <button id="addUser" class="btn btn-primary admin-only">+ 添加用户</button>
      <span class="hint admin-only">用户名需与飞牛 /user/me 返回的用户名一致</span>
      <button id="saveMyConfig" class="btn btn-primary" style="display:none">保存我的配置</button>
    </div>
    <!-- 管理员：用户表格 -->
    <table id="userTable" class="user-table admin-only" style="display:none">
      <thead>
        <tr>
          <th>用户名</th>
          <th>Last.fm</th>
          <th>ListenBrainz</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
    <!-- 普通用户：卡片列表 -->
    <div id="userList" class="user-list"></div>
  </section>

  <!-- 全局设置 -->
  <section id="tab-settings" class="tab-content">
    <div class="card">
      <h2>播放设置</h2>
      <div class="form-row">
        <label>Scrobble 阈值</label>
        <select id="scrobbleThreshold" class="input">
          <option value="auto">auto（自动：听满半曲或4分钟）</option>
          <option value="30s">30s</option>
          <option value="2m">2m</option>
          <option value="50%">50%</option>
          <option value="off">off（每次播放即记录）</option>
        </select>
      </div>
    </div>
    <div class="card">
      <h2>歌单同步</h2>
      <div class="form-row">
        <label>歌单同步总开关</label>
        <label class="switch">
          <input type="checkbox" id="playlistEnabled">
          <span class="slider"></span>
        </label>
      </div>
      <div class="form-row">
        <label>同步间隔</label>
        <input type="text" id="syncInterval" class="input" placeholder="30m">
      </div>
    </div>
    <div class="card">
      <h2>日志设置</h2>
      <div class="form-row">
        <label>日志级别</label>
        <select id="logLevel" class="input">
          <option value="info">info</option>
          <option value="debug">debug</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
      </div>
      <div class="form-row">
        <label>单文件大小(MB)</label>
        <input type="number" id="logMaxSize" class="input" min="0" value="3">
      </div>
      <div class="form-row">
        <label>保留份数</label>
        <input type="number" id="logMaxBackups" class="input" min="0" value="5">
      </div>
      <div class="form-row">
        <label>保留天数</label>
        <input type="number" id="logMaxAge" class="input" min="0" value="7">
      </div>
      <div class="form-row">
        <label>压缩历史日志</label>
        <label class="switch">
          <input type="checkbox" id="logCompress">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <button id="saveSettings" class="btn btn-primary">保存设置</button>
  </section>

  <!-- 运行状态 -->
  <section id="tab-state" class="tab-content">
    <div class="card">
      <h2>运行状态</h2>
      <div id="stateContent" class="state-content">加载中...</div>
    </div>
    <button id="refreshState" class="btn">刷新</button>
  </section>

  <!-- 日志 -->
  <section id="tab-logs" class="tab-content">
    <div class="card">
      <h2>日志（最后 200 行）</h2>
      <pre id="logContent" class="log-content">加载中...</pre>
    </div>
    <button id="refreshLogs" class="btn">刷新日志</button>
  </section>
</div>

<!-- 用户编辑模板 -->
<template id="userTemplate">
  <div class="card user-card">
    <div class="user-header">
      <h3 class="user-title">用户配置</h3>
      <button class="btn btn-danger btn-sm user-delete">删除</button>
    </div>
    <div class="form-row">
      <label>飞牛用户名</label>
      <input type="text" class="input user-name" placeholder="admin">
    </div>
    <div class="section-group">
      <h4 class="section-toggle" data-section="lastfm">
        <span class="toggle-icon">▶</span> Last.fm
        <label class="switch" onclick="event.stopPropagation()">
          <input type="checkbox" class="lfm-enabled">
          <span class="slider"></span>
        </label>
      </h4>
      <div class="section-body" style="display:none">
        <div class="form-row">
          <label>API Key</label>
          <input type="text" class="input lfm-api-key" placeholder="Last.fm API Key">
        </div>
        <div class="form-row">
          <label>API Secret</label>
          <div class="input-group">
            <input type="password" class="input lfm-api-secret" placeholder="Last.fm API Secret">
            <button type="button" class="btn-toggle-pwd" data-target=".lfm-api-secret">👁</button>
          </div>
        </div>
        <div class="form-row">
          <label>Session Key</label>
          <div class="input-group">
            <input type="password" class="input lfm-session-key" placeholder="留空则点击右侧按钮授权获取">
            <button type="button" class="btn-toggle-pwd" data-target=".lfm-session-key">👁</button>
          </div>
          <button type="button" class="btn btn-auth lfm-auth-btn" disabled>授权</button>
        </div>
        <div class="auth-status lfm-auth-status" style="display:none"></div>
        <div class="form-row">
          <label>用户名</label>
          <input type="text" class="input lfm-username" placeholder="Last.fm 用户名（自动获取）">
        </div>
        <div class="sub-group">
          <h5>智能歌单同步</h5>
          <div class="form-row">
            <label>最常听曲目</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lfm-top-enabled"><span class="slider"></span></label>
              <input type="text" class="input lfm-top-name" placeholder="LF {period} 最常听">
              <select class="input lfm-top-period">
                <option value="overall">overall（全部时间）</option>
                <option value="7day">7day（近7天）</option>
                <option value="1month">1month（近1月）</option>
                <option value="3month">3month（近3月）</option>
                <option value="6month">6month（近6月）</option>
                <option value="12month">12month（近12月）</option>
              </select>
              <input type="number" class="input lfm-top-limit" placeholder="50" min="0">
            </div>
          </div>
          <div class="form-row">
            <label>红心收藏</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lfm-loved-enabled"><span class="slider"></span></label>
              <input type="text" class="input lfm-loved-name" placeholder="LF 红心收藏">
              <input type="number" class="input lfm-loved-limit" placeholder="50" min="0">
            </div>
          </div>
          <div class="form-row">
            <label>最近播放</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lfm-recent-enabled"><span class="slider"></span></label>
              <input type="text" class="input lfm-recent-name" placeholder="LF 最近播放">
              <input type="number" class="input lfm-recent-limit" placeholder="50" min="0">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="section-group">
      <h4 class="section-toggle" data-section="listenbrainz">
        <span class="toggle-icon">▶</span> ListenBrainz
        <label class="switch" onclick="event.stopPropagation()">
          <input type="checkbox" class="lb-enabled">
          <span class="slider"></span>
        </label>
      </h4>
      <div class="section-body" style="display:none">
        <div class="form-row">
          <label>Token</label>
          <div class="input-group">
            <input type="password" class="input lb-token" placeholder="ListenBrainz User Token">
            <button type="button" class="btn-toggle-pwd" data-target=".lb-token">👁</button>
          </div>
        </div>
        <div class="form-row">
          <label>用户名</label>
          <input type="text" class="input lb-username" placeholder="ListenBrainz 用户名（自动获取）">
        </div>
        <div class="sub-group">
          <h5>推荐歌单同步</h5>
          <div class="form-row">
            <label>每日推荐</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lb-daily-enabled"><span class="slider"></span></label>
              <input type="text" class="input lb-daily-name" placeholder="LB 每日推荐">
              <input type="number" class="input lb-daily-limit" placeholder="0" min="0">
            </div>
          </div>
          <div class="form-row">
            <label>每周推荐</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lb-weekly-enabled"><span class="slider"></span></label>
              <input type="text" class="input lb-weekly-name" placeholder="LB 每周推荐">
              <input type="number" class="input lb-weekly-limit" placeholder="0" min="0">
            </div>
          </div>
          <div class="form-row">
            <label>每周探索</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lb-exploration-enabled"><span class="slider"></span></label>
              <input type="text" class="input lb-exploration-name" placeholder="LB 每周探索">
              <input type="number" class="input lb-exploration-limit" placeholder="0" min="0">
            </div>
          </div>
          <div class="form-row">
            <label>年度发现</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lb-discoveries-enabled"><span class="slider"></span></label>
              <input type="text" class="input lb-discoveries-name" placeholder="LB {year} 年度发现">
              <input type="number" class="input lb-discoveries-limit" placeholder="0" min="0">
            </div>
          </div>
          <div class="form-row">
            <label>年度遗珠</label>
            <div class="inline-row">
              <label class="switch"><input type="checkbox" class="lb-missed-enabled"><span class="slider"></span></label>
              <input type="text" class="input lb-missed-name" placeholder="LB {year} 年度遗珠">
              <input type="number" class="input lb-missed-limit" placeholder="0" min="0">
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn btn-primary user-save" style="display:none">保存此用户</button>
  </div>
</template>

<!-- 添加用户模态框 -->
<div id="addUserModal" class="modal" style="display:none">
  <div class="modal-overlay"></div>
  <div class="modal-dialog">
    <h2>添加用户</h2>
    <p class="hint" style="margin-bottom:12px">用户名需与飞牛 /user/me 返回的用户名一致</p>
    <div class="form-row">
      <label>飞牛用户名</label>
      <input type="text" id="newUserName" class="input" placeholder="例如 admin" autofocus>
    </div>
    <div class="modal-actions">
      <button id="cancelAddUser" class="btn">取消</button>
      <button id="confirmAddUser" class="btn btn-primary">确认添加</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>window.BaseURL = "{{.BaseURL}}";</script>
<script src="{{.BaseURL}}/app.js"></script>
</body>
</html>
