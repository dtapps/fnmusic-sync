            # 是否启用 Issue 同步功能
            issueSyncEnabled: true
            # 是否忽略文档处理失败
            ignoreProcessFailures: true
  # Issue 关闭时
  issue.close:
    - stages:
        - name: 知识库构建
          type: knowledge:update
          allowFailure: true
