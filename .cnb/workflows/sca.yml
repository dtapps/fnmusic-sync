# 开源组件漏洞扫描
# https://docs.cnb.cool/zh/security/sca-vulnerability.html
# License 扫描
# https://docs.cnb.cool/zh/security/sca-license.html
# SBOM 生成
# https://docs.cnb.cool/zh/security/sca-sbom.html
'**':
  push:
    - name: SCA 全量扫描与通知
      # 密钥通过 imports 从私有仓库导入
      imports: https://cnb.cool/dtapp/envs/-/blob/main/webhook.yml
      stages:
        - name: 开源组件漏洞全量扫描
          image: cnbcool/sca-vulnerability:latest
          timeout: 15m
          settings:
            # 扫描模式：diff 为 PR 增量，full 为当前 CNB_COMMIT 全量
            scanMode: full
            # 触发门禁的最低漏洞等级：low、medium、high、critical；未配置时不执行门禁
            # failOnSeverity: high
            # 是否生成并上传报告附件
            publish: true

        - name: License 全量扫描
          image: cnbcool/sca-license:latest
          timeout: 15m
          settings:
            # 扫描模式：diff 为 PR 增量，full 为当前 CNB_COMMIT 全量
            scanMode: full
            # 触发门禁的最低 License 风险等级：low、medium、high；未配置时不执行门禁
            # failOnSeverity: high
            # 是否生成并上传报告附件
            publish: true

        - name: 生成完整 SBOM
          image: cnbcool/sca-sbom:latest
          timeout: 30m
          settings:
            # 扫描模式：diff 为 PR 组件变化，full 为当前 CNB_COMMIT 的全部组件
            scanMode: full
            # 报告格式
            format: spdx
            # 是否生成并上传报告附件
            publish: true
      # 用 endStages 而非 stages：即使门禁失败（stage 返回非零）通知仍会执行；且 endStages 失败不影响流水线状态
      endStages:
        # SCA 插件把结果摘要写入 Commit Annotation（sca.<capability>.full.<field>），需通过 OpenAPI 读取
        # 字段：各等级 count、gate 门禁结果、reporter 报告地址；格式化为 markdown 后供三个平台发送
        - name: 汇总 SCA 全量扫描结果
          image: docker.cnb.cool/dtapp/alpine:latest # 统一使用预构建的 CI 环境镜像
          script: sh scripts/ci/render-ci-notice.sh sca full sca_notice.md
          exports:
            sca: SCA_RESULT
            # 飞书用 post 富文本（filepath 读 *_feishu.json），查看详情为可点击 a 标签
            sca_text: SCA_RESULT_TEXT
        # https://docs.cnb.cool/zh/plugin/public/tencentcom/wecom-message.html
        - name: 企业微信通知
          allowFailure: true
          image: tencentcom/wecom-message
          settings:
            robot: $WECOM_BOT_WEBHOOK
            msgType: markdown
            fromFile: sca_notice.md
            lastMsg: 完整结果请查看报告链接
        # https://docs.cnb.cool/zh/plugin/public/tencentcom/feishu-message.html
        - name: 飞书通知
          allowFailure: true
          image: tencentcom/feishu-message
          settings:
            robot: $FEISHU_BOT_WEBHOOK
            msg_type: post
            filepath: sca_notice_feishu.json
        # https://docs.cnb.cool/zh/plugin/public/tencentcom/dingtalk-bot-msg.html
        - name: 钉钉通知
          allowFailure: true
          image: tencentcom/dingtalk-bot-msg:latest
          settings:
            c_type: markdown
            webhook: $DINGTALK_BOT_WEBHOOK
            secret: $DINGTALK_BOT_SECRET
            content: $SCA_RESULT
  pull_request.target:
    - name: SCA 增量扫描与通知
      # 密钥通过 imports 从私有仓库导入
      imports: https://cnb.cool/dtapp/envs/-/blob/main/webhook.yml
      stages:
        - name: 开源组件漏洞扫描
          image: cnbcool/sca-vulnerability:latest
          timeout: 15m
          settings:
            # 扫描模式：diff 为 PR 增量（默认），full 为当前 CNB_COMMIT 全量
            scanMode: diff
            # 触发门禁的最低漏洞等级：low、medium、high、critical；未配置时不执行门禁
            failOnSeverity: high

        - name: License 扫描
          image: cnbcool/sca-license:latest
          timeout: 15m
          settings:
            # 扫描模式：diff 为 PR 增量，full 为当前 CNB_COMMIT 全量
            scanMode: diff
            # 触发门禁的最低 License 风险等级：low、medium、high；未配置时不执行门禁
            failOnSeverity: high

        - name: 扫描组件变化
          image: cnbcool/sca-sbom:latest
          timeout: 30m
          settings:
            # 扫描模式：diff 为 PR 组件变化，full 为当前 CNB_COMMIT 的全部组件
            scanMode: diff
      endStages:
        # 增量扫描的 Commit Annotation 关联到 PR 源分支最新提交（CNB_PULL_REQUEST_SHA）
        - name: 汇总 SCA 增量扫描结果
          image: docker.cnb.cool/dtapp/alpine:latest # 统一使用预构建的 CI 环境镜像
          script: sh scripts/ci/render-ci-notice.sh sca diff sca_notice.md
          exports:
            sca: SCA_RESULT
            # 飞书用 post 富文本（filepath 读 *_feishu.json），查看详情为可点击 a 标签
            sca_text: SCA_RESULT_TEXT
        # https://docs.cnb.cool/zh/plugin/public/tencentcom/wecom-message.html
        - name: 企业微信通知
          allowFailure: true
          image: tencentcom/wecom-message
          settings:
            robot: $WECOM_BOT_WEBHOOK
            msgType: markdown
            fromFile: sca_notice.md
            lastMsg: 完整结果请查看报告链接
        # https://docs.cnb.cool/zh/plugin/public/tencentcom/feishu-message.html
        - name: 飞书通知
          allowFailure: true
          image: tencentcom/feishu-message
          settings:
            robot: $FEISHU_BOT_WEBHOOK
            msg_type: post
            filepath: sca_notice_feishu.json
        # https://docs.cnb.cool/zh/plugin/public/tencentcom/dingtalk-bot-msg.html
        - name: 钉钉通知
          allowFailure: true
          image: tencentcom/dingtalk-bot-msg:latest
          settings:
            c_type: markdown
            webhook: $DINGTALK_BOT_WEBHOOK
            secret: $DINGTALK_BOT_SECRET
            content: $SCA_RESULT
